<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Licitações 2026</title>
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Outfit:wght@200;300;400;500;600;700&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.6.0/mammoth.browser.min.js"></script>
<style>
:root {
  --bg: #1c1c1c;
  --surface: #262626;
  --surface-2: #303030;
  --ink: #f0f0f0;
  --ink-2: #d4d2c9;
  --muted: #888880;
  --muted-2: #606058;
  --line: #383838;
  --line-strong: #4a4a4a;
  --radius: 12px;
  --ease: cubic-bezier(0.22, 0.61, 0.36, 1);
  --shadow-hover: 0 12px 32px -12px rgba(0,0,0,0.5), 0 2px 6px -2px rgba(0,0,0,0.3);
}
html.light {
  --bg: #f4f3f0;
  --surface: #eceae5;
  --surface-2: #e4e2dc;
  --ink: #111110;
  --ink-2: #2e2d2a;
  --muted: #706f69;
  --muted-2: #a8a89f;
  --line: #d6d4ce;
  --line-strong: #bfbdb6;
  --shadow-hover: 0 12px 32px -12px rgba(0,0,0,0.12), 0 2px 6px -2px rgba(0,0,0,0.06);
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{transition:background 300ms var(--ease),color 300ms var(--ease)}
html,body{height:100%;background:var(--bg);color:var(--ink);font-family:'Inter',system-ui,sans-serif;font-size:20px;line-height:1.1;-webkit-font-smoothing:antialiased;overflow:hidden}

/* ─── APP SHELL ─── */
.app{display:flex;flex-direction:column;height:100vh;position:relative;z-index:1}
/* ─── GRID BACKGROUND ─── */
.grid-bg{
  position:fixed;inset:0;z-index:0;pointer-events:none;
  background-image:
    linear-gradient(var(--grid-line,rgba(200,200,200,.04)) 1px,transparent 1px),
    linear-gradient(90deg,var(--grid-line,rgba(200,200,200,.04)) 1px,transparent 1px);
  background-size:64px 64px;
}
.grid-bg::after{
  content:'';position:absolute;inset:0;
  background-image:
    linear-gradient(var(--grid-glow,rgba(120,170,255,.2)) 1px,transparent 1px),
    linear-gradient(90deg,var(--grid-glow,rgba(120,170,255,.2)) 1px,transparent 1px);
  background-size:64px 64px;
  -webkit-mask-image:radial-gradient(circle 220px at var(--mx,50%) var(--my,50%),black 0%,transparent 100%);
  mask-image:radial-gradient(circle 220px at var(--mx,50%) var(--my,50%),black 0%,transparent 100%);
}
html.light .grid-bg{--grid-line:rgba(0,0,0,.06);--grid-glow:rgba(60,100,220,.22)}

/* ─── TOPBAR ─── */
.topbar{
  position:relative;z-index:20;
  display:flex;align-items:center;justify-content:space-between;
  padding:clamp(14px,2vh,22px) clamp(24px,3vw,56px);
  border-bottom:1px solid var(--line);
  background:var(--bg);
  flex-shrink:0;
}
.brand{
  font-family:'Outfit',sans-serif;font-weight:500;font-size:clamp(13px,1vw,16px);
  letter-spacing:0.06em;text-transform:uppercase;color:var(--ink);
}
.brand span{color:var(--muted);margin-left:6px;font-weight:300}
.nav-group{display:flex;gap:8px}
.nav-btn{
  appearance:none;background:transparent;
  border:1px solid var(--line);color:var(--muted);
  font-family:'Outfit',sans-serif;font-size:12px;font-weight:500;
  letter-spacing:0.14em;text-transform:uppercase;
  padding:9px clamp(16px,1.4vw,24px);border-radius:var(--radius);
  cursor:pointer;min-width:100px;
  transition:background 220ms var(--ease),border-color 220ms var(--ease),color 220ms var(--ease),transform 160ms var(--ease);
}
.nav-btn:hover{background:var(--surface-2);border-color:var(--line-strong);color:var(--ink)}
.nav-btn.active{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.nav-btn:active{transform:scale(0.97)}

/* ─── TOPBAR LEFT ─── */
.topbar-left{display:flex;align-items:center;gap:10px}
.brand-btn{
  appearance:none;background:none;border:none;cursor:pointer;padding:0;
  font-family:'Outfit',sans-serif;font-weight:500;font-size:clamp(11px,0.9vw,14px);
  letter-spacing:0.06em;text-transform:uppercase;color:var(--ink);
  transition:color 200ms var(--ease);line-height:1.2;text-align:left;
}
.brand-btn:hover{color:var(--muted)}
.brand-btn span{display:block;color:var(--muted);font-weight:300;font-size:clamp(9px,0.75vw,11px);letter-spacing:0.08em;margin-top:1px}

/* ─── ICON BUTTON ─── */
.icon-btn{
  appearance:none;background:transparent;
  border:1px solid var(--line);color:var(--muted);
  width:36px;height:36px;border-radius:10px;flex-shrink:0;
  display:flex;align-items:center;justify-content:center;
  cursor:pointer;
  transition:background 220ms var(--ease),border-color 220ms var(--ease),color 220ms var(--ease),transform 160ms var(--ease);
}
.icon-btn:hover{background:var(--surface-2);border-color:var(--line-strong);color:var(--ink)}
.icon-btn:active{transform:scale(0.95)}
.icon-btn svg{width:15px;height:15px}

/* ─── SIDEBAR TOGGLE ─── */
.container.sidebar-home{grid-template-columns:1fr}
.container.sidebar-home .sidebar{display:none}
.container.sidebar-off{grid-template-columns:52px 1fr}
.sidebar-toggle-row{display:flex;justify-content:flex-start;padding:10px 10px 0 20px;flex-shrink:0}
/* ─── SIDEBAR ICON MODE ─── */
.sidebar.icon-mode{
  padding:0;overflow:hidden;
  display:flex;flex-direction:column;align-items:center;
}
.sb-icon-toggle{
  width:100%;display:flex;justify-content:center;
  padding:12px 0;border-bottom:1px solid var(--line);flex-shrink:0;
}
.sb-icon-btn{
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  width:100%;padding:13px 0;gap:0;
  cursor:pointer;background:none;border:none;border-left:2px solid transparent;
  color:var(--muted);
  transition:color 180ms var(--ease),background 180ms var(--ease),border-left-color 180ms var(--ease);
}
.sb-icon-btn:hover{color:var(--ink);background:rgba(240,240,240,0.04)}
.sb-icon-btn.active{color:var(--ink);border-left-color:var(--ink)}
.sb-icon-btn svg{width:18px;height:18px;flex-shrink:0}

/* ─── HOME PAGE ─── */
.home-wrap{
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  min-height:100%;
  padding:clamp(16px,3vh,40px) clamp(16px,3vw,48px);
}
.home-eyebrow{
  font-size:10px;letter-spacing:0.22em;text-transform:uppercase;
  color:var(--muted);font-weight:500;margin-bottom:16px;text-align:center;
}
.home-title{
  font-family:'Outfit',sans-serif;font-weight:200;
  font-size:clamp(42px,6vw,96px);letter-spacing:-0.04em;
  color:var(--ink);line-height:1.0;text-align:center;max-width:760px;
}
.home-sub{font-size:15px;color:var(--muted);font-weight:300;margin-top:12px;text-align:center}
.home-grid{
  display:grid;grid-template-columns:repeat(3,1fr);gap:16px;
  margin-top:20px;width:100%;max-width:960px;
}
@media(max-width:700px){.home-grid{grid-template-columns:repeat(2,1fr)}}
@media(max-width:450px){.home-grid{grid-template-columns:1fr}}
.home-card{
  background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);
  padding:16px 20px 20px;cursor:pointer;text-align:left;
  display:flex;flex-direction:column;gap:8px;
  position:relative;overflow:hidden;
  transition:transform 280ms var(--ease),border-color 280ms var(--ease),box-shadow 280ms var(--ease);
}
.home-card:hover{transform:translateY(-4px);border-color:var(--line-strong);box-shadow:var(--shadow-hover)}
.home-card-icon{color:var(--muted-2);margin-bottom:4px}
.home-card-icon svg{width:20px;height:20px}
.home-card-num{font-size:11px;letter-spacing:0.18em;text-transform:uppercase;color:var(--muted-2);font-weight:500}
.home-card-title{font-family:'Outfit',sans-serif;font-weight:400;font-size:18px;letter-spacing:-0.01em;color:var(--ink)}
.home-card-desc{font-size:13px;color:var(--muted);font-weight:300;line-height:1.65}
.home-card-arrow{
  position:absolute;bottom:18px;right:20px;
  font-size:14px;color:var(--muted-2);
  transition:transform 280ms var(--ease),color 280ms var(--ease);
}
.home-card:hover .home-card-arrow{transform:translate(3px,-3px);color:var(--ink)}

/* ─── THEME TOGGLE ─── */
.theme-toggle{
  appearance:none;background:transparent;
  border:1px solid var(--line);color:var(--muted);
  font-family:'Outfit',sans-serif;font-size:11px;font-weight:500;
  letter-spacing:0.12em;text-transform:uppercase;
  padding:9px 14px;border-radius:var(--radius);
  cursor:pointer;display:flex;align-items:center;gap:7px;
  transition:background 220ms var(--ease),border-color 220ms var(--ease),color 220ms var(--ease),transform 160ms var(--ease);
  flex-shrink:0;
}
.theme-toggle:hover{background:var(--surface-2);border-color:var(--line-strong);color:var(--ink)}
.theme-toggle:active{transform:scale(0.97)}
.theme-toggle svg{width:14px;height:14px;flex-shrink:0}
.topbar-right{display:flex;align-items:center;gap:8px}

/* ─── CONTAINER ─── */
.container{display:grid;grid-template-columns:220px 1fr;flex:1;overflow:hidden}
@media(max-width:768px){.container{grid-template-columns:1fr}.sidebar{display:none}}

/* ─── SIDEBAR ─── */
.sidebar{
  border-right:1px solid var(--line);overflow-y:auto;
  padding:clamp(12px,2vh,20px) 0;
  scrollbar-width:thin;scrollbar-color:var(--line) transparent;
}
.sidebar-section-title{
  font-size:11px;letter-spacing:0.2em;text-transform:uppercase;
  color:var(--muted-2);padding:0 20px 10px;font-weight:500;
}
.sidebar-link{
  display:block;padding:8px 20px;
  font-size:14px;font-weight:400;color:var(--muted);
  cursor:pointer;text-decoration:none;
  transition:color 200ms var(--ease),padding-left 200ms var(--ease),background 200ms var(--ease);
  border-left:2px solid transparent;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.sidebar-link:hover{color:var(--ink-2);padding-left:26px;background:rgba(240,240,240,0.03)}
.sidebar-link.active{color:var(--ink);border-left-color:var(--ink);padding-left:26px}
.sidebar-divider{height:1px;background:var(--line);margin:12px 20px}

/* ─── MAIN ─── */
.main{overflow-y:auto;padding:clamp(12px,2vh,24px) clamp(16px,2vw,36px);scrollbar-width:thin;scrollbar-color:var(--line) transparent}
.section-header{margin-bottom:clamp(8px,1.5vh,20px)}
.section-eyebrow{
  display:inline-flex;align-items:center;gap:8px;
  font-size:12px;letter-spacing:0.2em;text-transform:uppercase;
  color:var(--muted);font-weight:500;margin-bottom:8px;
}
.section-eyebrow .dot{width:3px;height:3px;background:var(--muted);border-radius:50%;flex-shrink:0}
.section-title{
  font-family:'Outfit',sans-serif;font-weight:200;
  font-size:clamp(32px,4vw,56px);letter-spacing:-0.04em;
  color:var(--ink);line-height:1.05;
}
.section-subtitle{
  font-size:14px;color:var(--muted);font-weight:300;margin-top:8px;
  max-width:60ch;line-height:1.4;
}


/* ─── CHECKLIST ─── */
.ck-search-wrap{margin-bottom:28px}
.ck-search{
  width:100%;background:var(--surface);border:1px solid var(--line);
  border-radius:var(--radius);padding:13px 18px;
  font-family:'Outfit',sans-serif;font-size:14px;font-weight:300;color:var(--ink);
  outline:none;transition:border-color 220ms var(--ease);
}
.ck-search::placeholder{color:var(--muted-2)}
.ck-search:focus{border-color:var(--line-strong)}
.grupo{margin-bottom:32px;scroll-margin-top:80px}
.grupo-header{
  display:flex;align-items:center;gap:16px;
  cursor:pointer;padding:14px 0;border-bottom:1px solid var(--line);margin-bottom:8px;
  user-select:none;
}
.grupo-eyebrow{
  font-size:12px;letter-spacing:0.18em;text-transform:uppercase;
  color:var(--muted-2);font-weight:500;flex:1;
}
.grupo-count{font-size:12px;color:var(--muted-2)}
.grupo-chevron{font-size:12px;color:var(--muted-2);transition:transform 280ms var(--ease)}
.grupo.collapsed .grupo-chevron{transform:rotate(-90deg)}
.grupo-items{transition:opacity 200ms var(--ease)}
.grupo.collapsed .grupo-items{display:none}
.ck-item{border-bottom:1px solid var(--line)}
.ck-item-header{
  display:flex;align-items:center;gap:14px;
  padding:13px 0;cursor:pointer;
  transition:padding-left 200ms var(--ease);
  user-select:none;
}
.ck-item-header:hover{padding-left:8px}
.ck-item-titulo{font-size:15px;color:var(--ink-2);font-weight:300;flex:1;line-height:1.4}
.ck-item-badge{
  font-size:9px;letter-spacing:0.12em;text-transform:uppercase;font-weight:500;
  color:var(--muted-2);border:1px solid var(--line);border-radius:20px;padding:3px 9px;flex-shrink:0;
}
.ck-item-arrow{font-size:10px;color:var(--muted-2);transition:transform 280ms var(--ease);flex-shrink:0}
.ck-item.open .ck-item-arrow{transform:rotate(180deg)}
.ck-expand{max-height:0;overflow:hidden;transition:max-height 400ms var(--ease)}
.ck-item.open .ck-expand{max-height:2000px}
.ck-panels{padding:4px 0 12px 28px;display:flex;flex-direction:column;gap:10px}
.ck-panel-label{
  font-size:11px;letter-spacing:0.16em;text-transform:uppercase;
  color:var(--muted);font-weight:500;margin-bottom:8px;display:block;
}
.ck-panel-content{
  background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:14px 16px;
  font-size:15px;color:var(--ink-2);line-height:1.7;font-weight:300;
}
.ck-recurso-wrap{position:relative}
.ck-recurso-actions{
  display:flex;gap:8px;margin-bottom:10px;
}
.ck-btn{
  appearance:none;background:transparent;
  border:1px solid var(--line);color:var(--muted);
  font-family:'Outfit',sans-serif;font-size:10px;font-weight:500;
  letter-spacing:0.12em;text-transform:uppercase;
  padding:6px 14px;border-radius:var(--radius);cursor:pointer;
  transition:background 180ms var(--ease),border-color 180ms var(--ease),color 180ms var(--ease);
}
.ck-btn:hover{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.ck-btn.copied{border-color:var(--line-strong);color:var(--ink)}
.ck-recurso-text{
  background:var(--surface-2);border:1px solid var(--line);
  border-left:3px solid var(--line-strong);
  border-radius:0 var(--radius) var(--radius) 0;
  padding:16px 18px;font-size:15px;color:var(--ink-2);
  line-height:1.85;font-weight:300;white-space:pre-wrap;
  outline:none;cursor:default;
  transition:border-left-color 200ms var(--ease),background 200ms var(--ease);
}
.ck-recurso-text[contenteditable="true"]{
  border-left-color:var(--ink);background:var(--surface);cursor:text;
}
.ck-empty{text-align:center;color:var(--muted-2);padding:48px 24px;font-size:14px}

/* ─── EDITAL READER ─── */
.er-layout{display:grid;grid-template-columns:1fr 320px;gap:28px;align-items:start}
@media(max-width:1000px){.er-layout{grid-template-columns:1fr}}
.er-upload-area{
  border:2px dashed var(--line-strong);border-radius:var(--radius);
  padding:36px 24px;text-align:center;cursor:pointer;
  transition:border-color 220ms var(--ease),background 220ms var(--ease);
}
.er-upload-area:hover,.er-upload-area.drag-over{border-color:var(--ink);background:rgba(240,240,240,0.03)}
.er-upload-icon{color:var(--muted-2);margin-bottom:10px}
.er-upload-icon svg{width:28px;height:28px}
.er-upload-label{font-size:14px;color:var(--muted);font-weight:300}
.er-upload-hint{font-size:11px;color:var(--muted-2);margin-top:5px}
.er-file-info{
  background:var(--surface);border:1px solid var(--line-strong);border-radius:var(--radius);
  padding:12px 16px;display:flex;align-items:center;gap:10px;margin-top:10px;
}
.er-file-name{font-size:13px;color:var(--ink);font-weight:400;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.er-file-size{font-size:11px;color:var(--muted);flex-shrink:0}
.er-file-remove{background:none;border:none;cursor:pointer;color:var(--muted-2);font-size:16px;padding:0;line-height:1;transition:color 180ms}
.er-file-remove:hover{color:var(--ink)}
.er-panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:20px}
.er-panel-title{font-size:10px;letter-spacing:0.2em;text-transform:uppercase;color:var(--muted);font-weight:500;margin-bottom:14px}
.er-type-row{display:flex;gap:8px;margin-bottom:14px}
.er-type-btn{
  flex:1;padding:10px 8px;border:1px solid var(--line);border-radius:var(--radius);
  background:transparent;font-family:'Outfit',sans-serif;
  font-size:10px;font-weight:500;letter-spacing:0.14em;text-transform:uppercase;
  color:var(--muted);cursor:pointer;transition:all 220ms var(--ease);
}
.er-type-btn:hover{background:var(--surface-2);border-color:var(--line-strong);color:var(--ink)}
.er-type-btn.active{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.er-analyze-btn{
  width:100%;padding:12px;background:var(--ink);border:1px solid var(--ink);border-radius:var(--radius);
  font-family:'Outfit',sans-serif;font-size:11px;font-weight:500;
  letter-spacing:0.14em;text-transform:uppercase;color:var(--bg);
  cursor:pointer;transition:all 220ms var(--ease);
}
.er-analyze-btn:hover{opacity:0.85}
.er-analyze-btn:disabled{opacity:0.35;cursor:not-allowed}
.er-loading{display:flex;align-items:center;gap:12px;padding:32px 24px;color:var(--muted);font-size:13px;font-weight:300}
.er-spinner{width:16px;height:16px;border:2px solid var(--line-strong);border-top-color:var(--ink);border-radius:50%;animation:spin 0.8s linear infinite;flex-shrink:0}
@keyframes spin{to{transform:rotate(360deg)}}
.er-result-card{
  background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);
  padding:clamp(18px,2.5vh,28px) clamp(16px,2vw,28px);margin-top:24px;
}
.er-result-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;gap:12px;flex-wrap:wrap}
.er-result-eyebrow{font-size:10px;letter-spacing:0.18em;text-transform:uppercase;color:var(--muted);font-weight:500}
.er-result-content{font-size:13.5px;color:var(--ink-2);line-height:1.75;font-weight:300}
.er-result-content h2{font-size:14px;font-weight:600;color:var(--ink);margin:18px 0 8px;letter-spacing:0}
.er-result-content h3{font-size:13px;font-weight:500;color:var(--ink);margin:14px 0 6px}
.er-result-content ul{padding-left:18px;margin:8px 0}
.er-result-content li{margin-bottom:6px}
.er-result-content strong{color:var(--ink);font-weight:500}
.er-result-content p{margin-bottom:10px}
.er-result-content code{font-family:monospace;font-size:12px;background:var(--surface-2);padding:1px 5px;border-radius:4px}
.er-complete-prompt{
  margin-top:16px;padding:14px 18px;
  background:var(--surface-2);border:1px solid var(--line-strong);border-radius:var(--radius);
  display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;
}
.er-complete-text{font-size:13px;color:var(--ink-2);font-weight:300}
.er-complete-btn{
  flex-shrink:0;appearance:none;background:transparent;
  border:1px solid var(--line);color:var(--muted);
  font-family:'Outfit',sans-serif;font-size:10px;font-weight:500;
  letter-spacing:0.12em;text-transform:uppercase;
  padding:8px 16px;border-radius:var(--radius);cursor:pointer;
  transition:all 180ms var(--ease);
}
.er-complete-btn:hover{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.er-history-section{margin-top:32px}
.er-history-title{font-size:10px;letter-spacing:0.2em;text-transform:uppercase;color:var(--muted);font-weight:500;margin-bottom:10px}
.er-history-list{display:flex;flex-direction:column;gap:6px}
.er-history-item{
  background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);
  padding:10px 14px;display:flex;align-items:center;gap:10px;cursor:pointer;
  transition:border-color 200ms var(--ease);
}
.er-history-item:hover{border-color:var(--line-strong)}
.er-history-name{font-size:12px;color:var(--ink);font-weight:400;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.er-history-meta{font-size:10px;color:var(--muted);flex-shrink:0;letter-spacing:0.04em}
.er-history-clear{
  margin-top:10px;appearance:none;background:transparent;
  border:1px solid var(--line);color:var(--muted-2);
  font-family:'Outfit',sans-serif;font-size:10px;font-weight:500;
  letter-spacing:0.12em;text-transform:uppercase;
  padding:6px 14px;border-radius:var(--radius);cursor:pointer;
  transition:all 180ms var(--ease);
}
.er-history-clear:hover{border-color:var(--line-strong);color:var(--muted)}
.er-copy-btn{
  appearance:none;background:transparent;
  border:1px solid var(--line);color:var(--muted);
  font-family:'Outfit',sans-serif;font-size:10px;font-weight:500;
  letter-spacing:0.12em;text-transform:uppercase;
  padding:7px 14px;border-radius:var(--radius);cursor:pointer;
  transition:all 180ms var(--ease);
}
.er-copy-btn:hover{background:var(--surface-2);border-color:var(--line-strong);color:var(--ink)}
.er-error{
  background:var(--surface);border:1px solid var(--line-strong);border-radius:var(--radius);
  padding:20px 24px;margin-top:16px;font-size:13px;color:var(--muted);font-weight:300;line-height:1.7;
}

/* ─── SCROLLBAR ─── */
::-webkit-scrollbar{width:4px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--line-strong);border-radius:2px}

/* ─── CALCULADORA ─── */
.calc-layout{display:grid;grid-template-columns:1fr 340px;gap:20px;align-items:start}
@media(max-width:1000px){.calc-layout{grid-template-columns:1fr}}

.calc-form-card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:16px 20px}
.calc-form-title{font-size:10px;letter-spacing:0.2em;text-transform:uppercase;color:var(--muted);font-weight:500;margin-bottom:12px}

.field-group{margin-bottom:10px}
.field-label{display:block;font-size:10px;letter-spacing:0.14em;text-transform:uppercase;color:var(--muted);font-weight:500;margin-bottom:4px}
.field-hint{font-size:10px;color:var(--muted-2);margin-top:3px;font-weight:300}
.field-input{
  width:100%;background:var(--bg);border:1px solid var(--line);border-radius:8px;
  color:var(--ink);font-family:'Outfit',sans-serif;font-size:14px;font-weight:400;
  padding:7px 12px;transition:border-color 200ms var(--ease),box-shadow 200ms var(--ease);
  appearance:none;
}
.field-input:focus{outline:none;border-color:var(--line-strong);box-shadow:0 0 0 3px rgba(240,240,240,0.06)}
.field-input::placeholder{color:var(--muted-2)}
.field-row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.field-select{
  width:100%;background:var(--bg);border:1px solid var(--line);border-radius:8px;
  color:var(--ink);font-family:'Outfit',sans-serif;font-size:14px;font-weight:400;
  padding:7px 12px;cursor:pointer;
  transition:border-color 200ms var(--ease);
}
.field-select:focus{outline:none;border-color:var(--line-strong)}

.calc-result-card{
  background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);
  padding:16px 20px;
  position:sticky;top:24px;
}
.calc-result-label{font-size:10px;letter-spacing:0.2em;text-transform:uppercase;color:var(--muted);font-weight:500;margin-bottom:4px}
.calc-pmv-value{
  font-family:'Outfit',sans-serif;font-weight:200;
  font-size:clamp(28px,3vw,40px);letter-spacing:-0.04em;
  color:var(--ink);line-height:1;margin-bottom:14px;
}
.calc-pmv-value.error{font-size:16px;font-weight:400;color:var(--muted);letter-spacing:0}
.calc-breakdown{display:flex;flex-direction:column;gap:0;margin-bottom:12px}
.calc-row{display:flex;justify-content:space-between;align-items:baseline;gap:8px;padding:7px 0;border-bottom:1px solid var(--line)}
.calc-row:last-child{border-bottom:none}
.calc-row-label{font-size:12px;color:var(--muted);font-weight:300}
.calc-row-value{font-size:13px;color:var(--ink);font-weight:400;letter-spacing:-0.01em;white-space:nowrap}
.calc-total-row{
  background:var(--surface-2);border-radius:8px;
  padding:10px 14px;display:flex;justify-content:space-between;align-items:center;
  margin-top:6px;
}
.calc-total-label{font-size:10px;letter-spacing:0.14em;text-transform:uppercase;color:var(--muted);font-weight:500}
.calc-total-value{font-size:18px;font-weight:500;color:var(--ink);letter-spacing:-0.02em}

.calc-section{margin-top:20px}
.calc-section-title{font-size:11px;letter-spacing:0.2em;text-transform:uppercase;color:var(--muted);font-weight:500;margin-bottom:16px}

.callout-info{
  background:var(--surface);border-left:3px solid var(--line-strong);
  border-radius:0 var(--radius) var(--radius) 0;
  padding:16px 20px;margin-bottom:28px;font-size:13px;line-height:1.75;color:var(--ink-2);font-weight:300;
}
.callout-info strong{color:var(--ink);font-weight:500}

.simples-grid{display:grid;grid-template-columns:1fr 1fr;gap:20px}
@media(max-width:900px){.simples-grid{grid-template-columns:1fr}}
.simples-table-wrap{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden}
.simples-table-header{padding:14px 18px;border-bottom:1px solid var(--line)}
.simples-table-title{font-size:12px;font-weight:500;letter-spacing:0.08em;text-transform:uppercase;color:var(--ink)}
.simples-table-sub{font-size:11px;color:var(--muted);font-weight:300;margin-top:2px}
table.simples{width:100%;border-collapse:collapse;font-size:12px}
table.simples thead th{padding:8px 18px;text-align:left;font-size:10px;letter-spacing:0.14em;text-transform:uppercase;color:var(--muted);font-weight:500;border-bottom:1px solid var(--line)}
table.simples tbody tr{cursor:pointer;transition:background 150ms}
table.simples tbody tr:hover{background:var(--surface-2)}
table.simples tbody tr.selected{background:var(--surface-2)}
table.simples tbody tr.selected td:first-child::before{content:'→ ';color:var(--ink);font-weight:600}
table.simples td{padding:10px 18px;color:var(--ink-2);border-bottom:1px solid var(--line)}
table.simples tbody tr:last-child td{border-bottom:none}
table.simples td.num{color:var(--ink);font-weight:400;text-align:right;font-variant-numeric:tabular-nums}
table.simples td.rev{color:var(--ink);font-weight:500;text-align:right;font-variant-numeric:tabular-nums}
/* ─── ACOMPANHAMENTO ─── */
.acomp-toolbar{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px;margin-bottom:20px}
.acomp-toolbar-right{display:flex;gap:10px;align-items:center}
.acomp-add-btn{
  appearance:none;background:var(--ink);color:var(--bg);border:none;
  font-family:'Outfit',sans-serif;font-size:12px;font-weight:500;letter-spacing:.1em;text-transform:uppercase;
  padding:10px 20px;border-radius:var(--radius);cursor:pointer;
  transition:opacity 180ms var(--ease);
}
.acomp-add-btn:hover{opacity:.85}
.acomp-sort-btn{
  appearance:none;background:transparent;border:1px solid var(--line);color:var(--muted);
  font-family:'Outfit',sans-serif;font-size:11px;font-weight:500;letter-spacing:.1em;text-transform:uppercase;
  padding:9px 16px;border-radius:var(--radius);cursor:pointer;display:flex;align-items:center;gap:6px;
  transition:background 180ms var(--ease),border-color 180ms var(--ease),color 180ms var(--ease);
}
.acomp-sort-btn:hover{background:var(--surface-2);border-color:var(--line-strong);color:var(--ink)}
.acomp-count-label{font-size:12px;color:var(--muted);font-weight:300}
.acomp-wrap{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden}
.acomp-scroll{overflow-x:auto}
.acomp-table{width:100%;border-collapse:collapse;min-width:900px}
.acomp-table thead th{
  padding:6px 8px;text-align:left;
  font-family:'Outfit',sans-serif;font-size:10px;letter-spacing:.12em;text-transform:uppercase;
  color:var(--muted);font-weight:500;border-bottom:1px solid var(--line);
  background:var(--surface);white-space:nowrap;
}
.acomp-table tbody tr{transition:background 140ms}
.acomp-table tbody tr:hover td{background:rgba(240,240,240,0.025)}
.acomp-table tbody tr.editing td{background:var(--surface-2)}
.acomp-table td{
  padding:5px 8px;color:var(--ink-2);border-bottom:1px solid var(--line);
  font-size:13px;vertical-align:middle;
}
.acomp-table tbody tr:last-child td{border-bottom:none}
.acomp-status{
  display:inline-block;padding:3px 10px;border-radius:20px;
  font-family:'Outfit',sans-serif;font-size:10px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;white-space:nowrap;
}
.acomp-status.st-disputar{border:1px solid #4a9eff55;color:#4a9eff;background:rgba(74,158,255,.08)}
.acomp-status.st-em-disputa{border:1px solid #f9731655;color:#f97316;background:rgba(249,115,22,.08)}
.acomp-status.st-habilitacao{border:1px solid #22c55e55;color:#22c55e;background:rgba(34,197,94,.08)}
.acomp-status.st-finalizado{border:1px solid #ef444455;color:#ef4444;background:rgba(239,68,68,.08)}
.acomp-obs-cell{max-width:200px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.acomp-link-btn{
  display:inline-flex;align-items:center;justify-content:center;
  width:28px;height:28px;border-radius:6px;
  border:1px solid var(--line);color:var(--muted);text-decoration:none;font-size:13px;
  transition:background 140ms,border-color 140ms,color 140ms;
}
.acomp-link-btn:hover{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.acomp-btn{
  appearance:none;background:transparent;border:1px solid var(--line);color:var(--muted);
  font-family:'Outfit',sans-serif;font-size:9px;font-weight:500;letter-spacing:0;text-transform:uppercase;
  padding:3px 7px;border-radius:4px;cursor:pointer;white-space:nowrap;
  transition:background 140ms,border-color 140ms,color 140ms;
}
.acomp-btn-icon{
  appearance:none;background:transparent;border:1px solid var(--line);color:var(--muted);
  width:22px;height:22px;border-radius:4px;cursor:pointer;font-size:9px;flex-shrink:0;
  display:flex;align-items:center;justify-content:center;
  transition:background 140ms,color 140ms;
}
.acomp-btn-icon:hover{background:var(--surface-2);color:var(--ink)}
.acomp-btn:hover{background:var(--surface-2);border-color:var(--line-strong);color:var(--ink)}
.acomp-btn.save{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.acomp-btn.save:hover{opacity:.85}
.acomp-btn.del{border-color:var(--line)}
.acomp-btn.del:hover{border-color:#e05555;color:#e05555;background:transparent}
.acomp-actions-cell{white-space:nowrap;display:flex;gap:4px;align-items:center}
.acomp-input{
  width:100%;background:var(--surface);border:1px solid var(--line-strong);border-radius:6px;
  padding:6px 10px;color:var(--ink);font-family:'Inter',sans-serif;font-size:13px;outline:none;
  transition:border-color 160ms;
}
.acomp-input:focus{border-color:var(--ink)}
select.acomp-input option{background:var(--surface);color:var(--ink)}
.acomp-date-filter{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.acomp-date-label{font-family:'Outfit',sans-serif;font-size:11px;font-weight:500;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);white-space:nowrap}
.acomp-date-input{background:transparent;border:1px solid var(--line);border-radius:var(--radius);padding:7px 10px;color:var(--ink);font-family:'Inter',sans-serif;font-size:12px;outline:none;cursor:pointer;transition:border-color 160ms;color-scheme:dark}
.acomp-date-input:focus{border-color:var(--line-strong)}
html.light .acomp-date-input{color-scheme:light}
.acomp-save-bar{display:flex;gap:8px;padding:12px 16px;border-top:1px solid var(--line);background:var(--surface)}
.acomp-empty{text-align:center;padding:64px 24px}
.acomp-empty-title{font-family:'Outfit',sans-serif;font-size:16px;font-weight:300;color:var(--muted);margin-bottom:8px}
.acomp-empty-sub{font-size:13px;color:var(--muted-2)}
/* ─── ACOMP DETAIL ─── */
.acomp-detail-header{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:24px}
.acomp-back-btn{
  appearance:none;background:transparent;border:1px solid var(--line);color:var(--muted);
  font-family:'Outfit',sans-serif;font-size:10px;font-weight:500;letter-spacing:.12em;text-transform:uppercase;
  padding:8px 14px;border-radius:var(--radius);cursor:pointer;display:flex;align-items:center;gap:6px;
  transition:background 140ms,border-color 140ms,color 140ms;flex-shrink:0;
}
.acomp-back-btn:hover{background:var(--surface-2);border-color:var(--line-strong);color:var(--ink)}
.acomp-detail-meta{display:flex;align-items:center;gap:10px;flex-wrap:wrap;flex:1}
.acomp-detail-edit-form{flex:1}
.acomp-detail-edit-row{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.acomp-detail-tag{font-family:'Outfit',sans-serif;font-size:11px;font-weight:500;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);white-space:nowrap}
.acomp-detail-val{font-size:13px;color:var(--ink-2);font-weight:400;white-space:nowrap}
.acomp-aliq-row{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:20px;padding:14px 16px;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius)}
.acomp-aliq-label{font-family:'Outfit',sans-serif;font-size:11px;font-weight:500;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);white-space:nowrap}
.acomp-aliq-input{background:transparent;border:1px solid var(--line);border-radius:8px;padding:6px 10px;color:var(--ink);font-family:'Inter',sans-serif;font-size:13px;width:90px;outline:none;transition:border-color 160ms;text-align:center}
.acomp-aliq-input:focus{border-color:var(--line-strong)}
.acomp-aliq-hint{font-size:12px;color:var(--muted-2);font-weight:300}
.acomp-item-add-btn{
  appearance:none;background:transparent;border:1px solid var(--line);color:var(--muted);
  font-family:'Outfit',sans-serif;font-size:10px;font-weight:500;letter-spacing:.12em;text-transform:uppercase;
  padding:4px 10px;border-radius:var(--radius);cursor:pointer;
  transition:background 140ms,border-color 140ms,color 140ms;
}
.acomp-item-add-btn:hover{background:var(--surface-2);border-color:var(--line-strong);color:var(--ink)}
.acomp-item-table{width:100%;border-collapse:collapse;min-width:1000px;font-size:13px}
.acomp-item-table thead th{
  text-align:left;padding:10px 12px;
  font-family:'Outfit',sans-serif;font-size:10px;font-weight:500;letter-spacing:.12em;text-transform:uppercase;
  color:var(--muted);border-bottom:1px solid var(--line);white-space:nowrap;
}
.acomp-item-table td{padding:4px 6px;border-bottom:1px solid var(--line);vertical-align:middle;font-size:13px}
.acomp-item-table tbody tr:last-child td{border-bottom:none}
.acomp-item-table tbody tr:hover td{background:rgba(240,240,240,0.025)}
.acomp-item-table tbody tr.editing td{background:var(--surface-2)}
.acomp-pmv-cell{font-weight:500;color:var(--ink);white-space:nowrap}
.acomp-lucro-pos{color:var(--ink-2);white-space:nowrap}
.acomp-lucro-neg{color:#e05555;white-space:nowrap}
.acomp-item-input{background:transparent;border:1px solid var(--line);border-radius:8px;padding:5px 8px;color:var(--ink);font-family:'Inter',sans-serif;font-size:12px;outline:none;transition:border-color 160ms;width:100%}
.acomp-item-input:focus{border-color:var(--line-strong)}
.acomp-item-empty{text-align:center;padding:40px 24px;color:var(--muted);font-size:14px;font-weight:300}
/* ─── MODAL ITEM CALCULADORA ─── */
.mi-overlay{position:fixed;inset:0;z-index:200;background:rgba(0,0,0,.72);backdrop-filter:blur(4px);display:flex;align-items:center;justify-content:center;padding:16px}
.mi-modal{background:var(--surface);border:1px solid var(--line-strong);border-radius:var(--radius);width:min(920px,100%);max-height:90vh;overflow-y:auto;display:flex;flex-direction:column}
.mi-modal-header{display:flex;justify-content:space-between;align-items:center;padding:18px 24px;border-bottom:1px solid var(--line);flex-shrink:0}
.mi-modal-body{display:grid;grid-template-columns:1fr 1fr;flex:1}
@media(max-width:640px){.mi-modal-body{grid-template-columns:1fr}}
.mi-left{padding:20px 24px;border-right:1px solid var(--line)}
.mi-right{padding:20px 24px;overflow-y:auto}
.mi-footer{padding:14px 24px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:10px;flex-shrink:0}
/* ─── DOCUMENTOS DE HABILITAÇÃO ─── */
.docs-section{margin-top:32px;padding-top:24px;border-top:1px solid var(--line)}
.docs-header{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px;margin-bottom:16px}
.docs-title{font-family:'Outfit',sans-serif;font-size:11px;font-weight:500;letter-spacing:.18em;text-transform:uppercase;color:var(--muted)}
.docs-btns{display:flex;gap:8px;flex-wrap:wrap}
.docs-list{display:flex;flex-direction:column;gap:6px}
.docs-item{display:flex;align-items:center;gap:12px;padding:10px 14px;background:var(--surface);border:1px solid var(--line);border-radius:10px;transition:border-color 140ms}
.docs-item:hover{border-color:var(--line-strong)}
.docs-item-name{flex:1;font-size:13px;color:var(--ink-2)}
.docs-item-link{appearance:none;background:transparent;border:1px solid var(--line);color:var(--muted);font-family:'Outfit',sans-serif;font-size:10px;font-weight:500;letter-spacing:.1em;text-transform:uppercase;padding:5px 10px;border-radius:8px;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;gap:4px;transition:background 140ms,border-color 140ms,color 140ms;white-space:nowrap}
.docs-item-link:hover{background:var(--surface-2);border-color:var(--line-strong);color:var(--ink)}
.docs-empty{color:var(--muted);font-size:13px;font-weight:300;padding:16px 0}
/* Selector modal */
.docs-sel-overlay{position:fixed;inset:0;z-index:200;background:rgba(0,0,0,.72);backdrop-filter:blur(4px);display:flex;align-items:center;justify-content:center;padding:16px}
.docs-sel-modal{background:var(--surface);border:1px solid var(--line-strong);border-radius:var(--radius);width:min(560px,100%);max-height:85vh;display:flex;flex-direction:column}
.docs-sel-header{display:flex;justify-content:space-between;align-items:center;padding:16px 20px;border-bottom:1px solid var(--line);flex-shrink:0}
.docs-sel-body{overflow-y:auto;padding:16px 20px;display:flex;flex-direction:column;gap:6px}
.docs-sel-footer{padding:12px 20px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:8px;flex-shrink:0}
.docs-sel-item{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:8px;cursor:pointer;transition:background 120ms}
.docs-sel-item:hover{background:var(--surface-2)}
.docs-sel-check{width:16px;height:16px;border:1px solid var(--line-strong);border-radius:4px;display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:10px;transition:background 120ms,border-color 120ms}
.docs-sel-check.on{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.docs-sel-group{font-family:'Outfit',sans-serif;font-size:10px;font-weight:500;letter-spacing:.14em;text-transform:uppercase;color:var(--muted-2);padding:10px 12px 4px;border-top:1px solid var(--line);margin-top:4px}
.docs-sel-group:first-child{border-top:none;margin-top:0;padding-top:0}
/* ─── REFERÊNCIA TABS ─── */
.ref-tabs{display:flex;border-bottom:1px solid var(--line);margin-bottom:32px;gap:0;flex-shrink:0}
.ref-tab{appearance:none;background:none;border:none;border-bottom:2px solid transparent;padding:10px 22px;font-family:'Outfit',sans-serif;font-size:12px;font-weight:500;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);cursor:pointer;margin-bottom:-1px;transition:color 160ms,border-bottom-color 160ms}
.ref-tab:hover{color:var(--ink)}
.ref-tab.active{color:var(--ink);border-bottom-color:var(--ink)}
/* ─── RECURSOS ─── */
.recursos-grupo{margin-bottom:40px}
.recursos-grupo-title{
  font-family:'Outfit',sans-serif;font-size:11px;font-weight:500;letter-spacing:.18em;text-transform:uppercase;
  color:var(--muted-2);padding:10px 0;border-bottom:1px solid var(--line);margin-bottom:16px;
}
.recursos-item{
  background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);
  padding:20px 22px;margin-bottom:12px;
  transition:border-color 200ms var(--ease);
}
.recursos-item:hover{border-color:var(--line-strong)}
.recursos-item-tipo{
  font-family:'Outfit',sans-serif;font-size:12px;font-weight:500;letter-spacing:.12em;text-transform:uppercase;
  color:var(--muted);margin-bottom:12px;
}

/* ─── BETA BADGE ─── */

function acompStatusClass(s){
  if(s==='A disputar') return 'st-disputar';
  if(s==='Em disputa') return 'st-em-disputa';
  if(s==='Habilitação') return 'st-habilitacao';
  if(s==='Finalizado') return 'st-finalizado';
  return 'st-disputar';
}

function acompViewRow(item){
  const sc = acompStatusClass(item.status);

    ? `<a href="${escHtml(item.link)}" target="_blank" class="acomp-link-btn" title="Abrir edital">${GLOBE_SVG}</a>`

    <td style="white-space:nowrap">${escHtml(item.uasg||'—')}</td>
    <td style="white-space:nowrap">${escHtml(item.pregao||'—')}</td>
    <td>${escHtml(item.orgao||'—')}</td>

    <td><div class="acomp-actions-cell">
      <button class="acomp-btn" onclick="acompOpenDetail('${item.id}')">Detalhes</button>

      <button class="acomp-btn del" onclick="acompConfirmDelete('${item.id}')">Excluir</button>
    </div></td>
  </tr>`;
  if(!isExp) return mainRow;
  const itens = item.itens||[];
  const aliq = item.aliq||0;
  const thS = 'style="text-align:left;padding:3px 8px;color:var(--muted);font-weight:500;border-bottom:1px solid var(--line);white-space:nowrap"';
  const thR = 'style="text-align:right;padding:3px 8px;color:var(--muted);font-weight:500;border-bottom:1px solid var(--line);white-space:nowrap"';
  const itensHtml = itens.length===0
    ? `<em style="color:var(--muted);font-size:12px">Nenhum item cadastrado.</em>`
    : `<table style="width:100%;border-collapse:collapse;font-size:11px">
        <thead><tr>
          <th ${thS}>Nº</th><th ${thS}>Fabricante</th><th ${thS}>Produto</th>
          <th ${thR}>Vl Edital</th><th ${thR}>Qtd</th><th ${thR}>Custo Unit.</th>
          <th ${thR}>Frete</th><th ${thR}>Margem</th><th ${thR}>Lance Mín.</th>
          <th ${thR}>PMV</th><th ${thR}>Lucro</th>
        </tr></thead>
        <tbody>${itens.map(it=>{
          const frete = Number(it.frete)||0;
          const pmv = acompCalcPMV(Number(it.custo_unit),frete,Number(it.margem),aliq);
          const lucro = pmv!==null?(pmv-Number(it.custo_unit)-frete)*Number(it.qtd):null;
          const pmvHtml = pmv!==null?`R$ ${fmtBRL(pmv)}`:'—';
          const lucroClass = lucro!==null&&lucro<0?'acomp-lucro-neg':'acomp-lucro-pos';
          const lucroHtml = lucro!==null?`<span class="${lucroClass}">R$ ${fmtBRL(lucro)}</span>`:'—';
          const td = 'style="padding:3px 8px"';
          const tdr = 'style="padding:3px 8px;text-align:right"';
          const tdm = 'style="padding:3px 8px;color:var(--muted)"';
          return `<tr>
            <td ${tdm}>${escHtml(String(it.num||''))}</td>
            <td ${td}>${escHtml(it.fabricante||'—')}</td>
            <td ${td}>${escHtml(it.produto||'—')}</td>
            <td ${tdr}>R$ ${fmtBRL(Number(it.valor_edital||0))}</td>
            <td ${tdr}>${escHtml(String(it.qtd||''))}</td>
            <td ${tdr}>R$ ${fmtBRL(Number(it.custo_unit||0))}</td>
            <td ${tdr}>${frete>0?'R$ '+fmtBRL(frete):'—'}</td>
            <td ${tdr}>${escHtml(String(it.margem||''))}%</td>
            <td ${tdr}>R$ ${fmtBRL(Number(it.lance_min||0))}</td>
            <td ${tdr}>${pmvHtml}</td>
            <td ${tdr}>${lucroHtml}</td>
          </tr>`;
        }).join('')}</tbody>

    const groups = {};
    selDocs.forEach(d=>{if(!groups[d.grupo])groups[d.grupo]=[];groups[d.grupo].push(d);});
    docsHtml = `<div style="margin-top:12px;border-top:1px solid var(--line);padding-top:10px">
      <div style="color:var(--muted);font-weight:500;letter-spacing:.08em;text-transform:uppercase;font-size:9px;margin-bottom:8px">Documentos de Habilitação</div>
      ${Object.entries(groups).map(([grupo,docs])=>`

          <div style="color:var(--muted-2);font-size:9px;letter-spacing:.06em;text-transform:uppercase;margin-bottom:4px">${escHtml(grupo)}</div>
          ${docs.map(d=>`<div style="padding:2px 0;font-size:11px;color:var(--ink-2)">${escHtml(d.nome)}</div>`).join('')}
        </div>`).join('')}
    </div>`;
  }
  return mainRow + `<tr class="acomp-expand-row"><td colspan="10" style="padding:8px 16px 12px;background:var(--surface-2);border-bottom:1px solid var(--line);overflow-x:auto">${itensHtml}${docsHtml}</td></tr>`;
}

function renderAcompDocsStandalone(lic){
  const wrap = document.getElementById('ck-docs-main');
  if(!wrap) return;
  if(!lic.docsSelecionados) lic.docsSelecionados=[];
  const all = docsAllDocs();
  const sel = lic.docsSelecionados;
  let itemsHtml = '';
  if(sel.length===0){
    itemsHtml = `<div class="docs-empty">Nenhum documento selecionado. Acesse "Detalhes" e clique em "+ Selecionar documentos" para adicionar.</div>`;
  } else {
    const groups = {};
    sel.forEach(docId=>{
      const doc = all.find(d=>d.id===docId);
      if(!doc) return;
      if(!groups[doc.grupo]) groups[doc.grupo]=[];
      groups[doc.grupo].push(doc);
    });
    Object.entries(groups).forEach(([grupo,docs])=>{
      itemsHtml += `<div style="margin-bottom:16px">
        <div class="sidebar-section-title" style="padding:0 0 8px">${escHtml(grupo)}</div>
        ${docs.map(doc=>{
          const linkBtn = doc.link
            ? `<a class="docs-item-link" href="${escHtml(doc.link)}" target="_blank" rel="noopener">Consultar ↗</a>`
            : `<span class="docs-item-link" style="opacity:0.35;cursor:default">Sem link</span>`;
          return `<div class="docs-item"><span class="docs-item-name">${escHtml(doc.nome)}</span>${linkBtn}</div>`;
        }).join('')}
      </div>`;
    });
  }
  wrap.innerHTML = `<div class="docs-section">
    <div class="docs-header">
      <span class="docs-title">Documentos de Habilitação</span>
      <div class="docs-btns">
        <button class="acomp-btn save" onclick="acompOpenDetail('${lic.id}')">Abrir Detalhes</button>
      </div>
    </div>
    <div class="docs-list">${itemsHtml}</div>
  </div>`;
}

function acompRenderTable(){
  const wrap = document.getElementById('acomp-wrap');
  const subtitle = document.getElementById('acomp-subtitle');
  const countLabel = document.getElementById('acomp-count-label');
  const sortBtn = document.getElementById('acomp-sort-btn');
  if(!wrap) return;

  let list = [...acompData];
  if(acompFilterActive) list = list.filter(x=>x.status===acompFilterActive);
  if(acompDateFrom) list = list.filter(x=>(x.data||'')>=acompDateFrom);
  if(acompDateTo)   list = list.filter(x=>(x.data||'')<=acompDateTo);

  list.sort((a,b)=>{
    const da=a.data||'', db=b.data||'';
    return acompSortDesc ? db.localeCompare(da) : da.localeCompare(db);
  });

  if(subtitle) subtitle.textContent = acompData.length + ' licitações';
  if(countLabel) countLabel.textContent = acompFilterActive ? `Filtro: ${acompFilterActive}` : '';
  if(sortBtn) sortBtn.innerHTML = `<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="${acompSortDesc?'M12 5v14M5 12l7 7 7-7':'M12 19V5M5 12l7-7 7 7'}"/></svg> ${acompSortDesc?'Mais recente':'Mais antiga'}`;

  if(list.length===0 && acompEditId!=='new'){
    wrap.innerHTML = `<div class="acomp-empty">
      <div class="acomp-empty-title">${acompFilterActive?'Nenhuma licitação com este status.':'Nenhuma licitação cadastrada.'}</div>
      <div class="acomp-empty-sub">${acompFilterActive?'<a href="#" onclick="acompFilterStatus(null);return false;" style="color:var(--muted)">Limpar filtro</a>':'Clique em "+ Nova Licitação" para começar.'}</div>
    </div>`;
    return;
  }

  let tbody = '';
  if(acompEditId==='new') tbody += acompEditRow({id:'new',data:'',uasg:'',pregao:'',orgao:'',tipo_lic:'Pregão',status:'A disputar',obs:'',link:''});
  list.forEach(item=>{
    tbody += item.id===acompEditId ? acompEditRow(item) : acompViewRow(item);
  });

  const editBar = acompEditId ? `<div class="acomp-save-bar">
    <button class="acomp-btn save" onclick="acompSave('${acompEditId}')">Salvar</button>
    <button class="acomp-btn" onclick="acompCancelEdit()">Cancelar</button>
  </div>` : '';

  wrap.innerHTML = `<div class="acomp-scroll"><table class="acomp-table">
    <thead><tr>
      <th style="width:28px"></th>
      <th>Data</th><th>Tipo</th><th>Nº UASG</th><th>Nº Pregão</th>
      <th>Nome do Órgão</th><th>Status</th><th>Observações</th>
      <th style="text-align:center">Link</th><th></th>
    </tr></thead>
    <tbody>${tbody}</tbody>
  </table></div>${editBar}`;
}

function acompAddNew(){
  const newId = Date.now().toString();
  const blank = {id:newId,data:'',uasg:'',pregao:'',orgao:'',tipo_lic:'Pregão',status:'A disputar',obs:'',link:'',aliq:0,itens:[],docsSelecionados:[]};
  acompData.unshift(blank);
  localStorage.setItem('acomp_data',JSON.stringify(acompData));
  acompDetailEditMode = true;
  acompOpenDetail(newId);
}

function acompStartEdit(id){
  acompEditId = id;

}

function acompCancelEdit(){
  acompEditId = null;
  acompRenderTable();
}

function acompSave(id){
  const v = f => document.getElementById(f)?.value || '';
  const existing = id==='new' ? null : acompData.find(x=>x.id===id);
  const item = {
    id: id==='new' ? String(Date.now()) : id,
    data: v('ae-data'), tipo_lic: v('ae-tipo-lic')||'Pregão',
    uasg: v('ae-uasg'), pregao: v('ae-pregao'),
    orgao: v('ae-orgao'), status: v('ae-status'),
    obs: v('ae-obs'), link: v('ae-link'),
    aliq: existing ? (existing.aliq||0) : 0,
    itens: existing ? (existing.itens||[]) : []
  };
  if(id==='new'){
    acompData.push(item);
  } else {
    const idx = acompData.findIndex(x=>x.id===id);
    if(idx>=0) acompData[idx] = item;
  }
  acompPersist();
  acompEditId = null;
  acompRenderTable();
  renderSidebar();
}

function acompConfirmDelete(id){
  const item = acompData.find(x=>x.id===id);
  const label = item ? (item.orgao||item.pregao||id) : id;
  if(confirm(`Excluir "${label}"?\n\nEsta ação não pode ser desfeita.`)){
    acompData = acompData.filter(x=>x.id!==id);
    acompPersist();
    if(acompEditId===id) acompEditId=null;
    acompRenderTable();
    renderSidebar();
  }
}

function acompToggleSort(){
  acompSortDesc = !acompSortDesc;
  acompRenderTable();
}

function acompFilterStatus(status){
  acompFilterActive = status;
  acompRenderTable();
}

function acompSetDate(field, val){
  if(field==='from') acompDateFrom = val;
  else acompDateTo = val;
  acompRenderTable();
  const clearBtn = document.getElementById('acomp-clear-date');
  if(clearBtn) clearBtn.style.display = (acompDateFrom||acompDateTo) ? 'flex' : 'none';
}

function acompExport(){
  const json = JSON.stringify(acompData, null, 2);
  const blob = new Blob([json], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'licitacoes-' + new Date().toISOString().slice(0,10) + '.json';
  a.click();
  URL.revokeObjectURL(url);
}

function acompImport(event){
  const file = event.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = e => {
    try{
      const data = JSON.parse(e.target.result);
      if(!Array.isArray(data)) throw new Error('Formato inválido');
      if(!confirm(`Importar ${data.length} licitação(ões)?\n\nIsso vai SUBSTITUIR todos os dados atuais.`)) return;
      acompData = data;
      acompPersist();
      acompRenderTable();
    } catch(err){
      alert('Erro ao importar: ' + err.message);
    }
  };
  reader.readAsText(file);
  event.target.value = '';
}

function acompClearDates(){
  acompDateFrom = '';
  acompDateTo = '';
  const f = document.getElementById('acomp-from');
  const t = document.getElementById('acomp-to');
  if(f) f.value = '';
  if(t) t.value = '';
  acompRenderTable();
  const clearBtn = document.getElementById('acomp-clear-date');
  if(clearBtn) clearBtn.style.display = 'none';
}

function acompCalcPMV(custo, frete, margem, aliq){
  const denom = 1 - margem/100 - aliq/100;
  if(denom <= 0) return null;
  return (custo + frete) / denom;
}

function fmtBRL(n){
  if(n===null||isNaN(n)) return '—';
  return n.toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2});
}

function acompItemRenderTable(lic){
  const wrap = document.getElementById('acomp-item-wrap');
  if(!wrap) return;

  if(!lic.itens) lic.itens = [];
  if(lic.itens.length===0){
    for(let i=0;i<3;i++){
      lic.itens.push({id:Date.now().toString()+'_'+i,num:i+1,fabricante:'',produto:'',valor_edital:'',qtd:'',custo_unit:'',frete:0,margem:25,lance_min:''});
    }
    acompPersist();
  }

  let tbody = '';
  lic.itens.forEach(item=>{ tbody += acompItemInlineRow(lic.id, item, lic.aliq||0); });

  wrap.innerHTML = `<div class="acomp-scroll"><table class="acomp-item-table">
    <thead><tr>
      <th style="width:44px">Nº</th>
      <th>Fabricante</th>
      <th>Produto</th>
      <th>Val. Edital</th>
      <th>Qtd</th>
      <th>Custo Unit.</th>
      <th>Frete</th>
      <th>Margem %</th>
      <th>Lance Mín.</th>
      <th>PMV *</th>
      <th>Lucro *</th>
      <th style="width:32px"></th>
    </tr></thead>
    <tbody>${tbody}</tbody>
    <tfoot><tr><td colspan="12" style="padding:5px 6px;border-top:1px solid var(--line)">
      <button class="acomp-item-add-btn" onclick="acompItemAddRow('${lic.id}')">+ Adicionar linha</button>
    </td></tr></tfoot>
  </table>
  <div style="padding:6px 8px;font-size:11px;color:var(--muted);font-weight:300">* PMV = (custo+frete) ÷ (1 − margem% − aliq%) &nbsp;|&nbsp; Lucro = (PMV − custo − frete) × qtd</div>
  </div>`;
}

function acompItemInlineRow(licId, item, aliq){
  const frete = Number(item.frete)||0;
  const pmv = acompCalcPMV(Number(item.custo_unit), frete, Number(item.margem), Number(aliq));
  const lucro = pmv!==null ? (pmv - Number(item.custo_unit) - frete) * Number(item.qtd) : null;
  const pmvTxt = pmv!==null ? `R$ ${fmtBRL(pmv)}` : '—';
  const lucroClass = lucro!==null && lucro < 0 ? 'acomp-lucro-neg' : 'acomp-lucro-pos';
  const lucroTxt = lucro!==null ? `R$ ${fmtBRL(lucro)}` : '—';
  const inp = (fid, type, val, w, ph) =>
    `<input class="acomp-item-input" id="ii-${item.id}-${fid}" type="${type}" value="${escHtml(String(val??''))}" placeholder="${ph||''}" style="min-width:${w}" oninput="acompItemUpdateCalc('${licId}','${item.id}')">`;
  return `<tr data-item-id="${item.id}">
    <td>${inp('num','number',item.num,'34px','')}</td>
    <td>${inp('fab','text',item.fabricante,'70px','')}</td>
    <td>${inp('prod','text',item.produto,'110px','')}</td>
    <td>${inp('vedital','number',item.valor_edital,'64px','')}</td>
    <td>${inp('qtd','number',item.qtd,'40px','')}</td>
    <td>${inp('custo','number',item.custo_unit,'64px','')}</td>
    <td>${inp('frete','number',item.frete,'54px','')}</td>
    <td>${inp('margem','number',item.margem,'46px','')}</td>
    <td>${inp('lance','number',item.lance_min,'64px','')}</td>
    <td style="white-space:nowrap"><span class="acomp-pmv-cell" id="ii-${item.id}-pmv">${pmvTxt}</span></td>
    <td style="white-space:nowrap"><span class="${lucroClass}" id="ii-${item.id}-lucro">${lucroTxt}</span></td>
    <td><button class="acomp-btn del" onclick="acompItemDelete('${licId}','${item.id}')" title="Excluir" style="padding:2px 6px">✕</button></td>
  </tr>`;
}

function acompItemAddRow(licId){
  const lic = acompData.find(x=>x.id===licId);
  if(!lic) return;
  lic.itens.push({id:Date.now().toString(),num:lic.itens.length+1,fabricante:'',produto:'',valor_edital:'',qtd:'',custo_unit:'',frete:0,margem:25,lance_min:''});
  acompPersist();
  acompItemRenderTable(lic);
  setTimeout(()=>{
    const rows = document.querySelectorAll('#acomp-item-wrap tbody tr');
    if(rows.length){const last=rows[rows.length-1];const inp=last.querySelector('.acomp-item-input');if(inp)inp.focus();}
  },50);
}

function acompItemUpdateCalc(licId, itemId){
  const lic = acompData.find(x=>x.id===licId);
  if(!lic) return;
  const item = (lic.itens||[]).find(x=>x.id===itemId);
  if(!item) return;
  const gv = fid => { const el = document.getElementById(`ii-${itemId}-${fid}`); return el ? el.value : ''; };
  item.num = gv('num');
  item.fabricante = gv('fab');
  item.produto = gv('prod');
  item.valor_edital = gv('vedital');
  item.qtd = gv('qtd');
  item.custo_unit = gv('custo');
  item.frete = gv('frete');
  item.margem = gv('margem');
  item.lance_min = gv('lance');
  acompPersist();
  const custo = Number(item.custo_unit)||0;
  const frete = Number(item.frete)||0;
  const margem = Number(item.margem)||0;
  const qtd = Number(item.qtd)||0;
  const pmv = acompCalcPMV(custo, frete, margem, lic.aliq||0);
  const lucro = pmv!==null ? (pmv - custo - frete) * qtd : null;
  const pmvEl = document.getElementById(`ii-${itemId}-pmv`);
  const lucroEl = document.getElementById(`ii-${itemId}-lucro`);
  if(pmvEl) pmvEl.textContent = pmv!==null ? `R$ ${fmtBRL(pmv)}` : '—';
  if(lucroEl){
    lucroEl.textContent = lucro!==null ? `R$ ${fmtBRL(lucro)}` : '—';
    lucroEl.className = lucro!==null && lucro < 0 ? 'acomp-lucro-neg' : 'acomp-lucro-pos';
  }
}

function acompItemDelete(licId, itemId){
  const lic = acompData.find(x=>x.id===licId);
  if(!lic) return;
  const it = lic.itens?.find(x=>x.id===itemId);
  const label = it ? (it.produto||it.fabricante||itemId) : itemId;
  if(confirm(`Excluir item "${label}"?\n\nEsta ação não pode ser desfeita.`)){
    lic.itens = (lic.itens||[]).filter(x=>x.id!==itemId);
    acompPersist();
    acompItemRenderTable(lic);
  }
}

function miCalcPopulateFaixas(){
  const tipo = document.getElementById('mi-tipo')?.value;
  if(!tipo) return;
  const sel = document.getElementById('mi-faixa');
  if(!sel) return;
  sel.innerHTML = '';
  SIMPLES[tipo].faixas.forEach((f,i)=>{
    const opt = document.createElement('option');
    opt.value = i;
    opt.textContent = f.faixa + ' — reversa ' + pct(f.reversa);
    sel.appendChild(opt);
  });
  const aliq = SIMPLES[tipo].faixas[0].reversa;
  const aliqEl = document.getElementById('mi-aliq');
  if(aliqEl) aliqEl.value = +(aliq*100).toFixed(2);
  miCalcUpdate();
}

function miCalcFaixaChange(){
  const tipo = document.getElementById('mi-tipo')?.value;
  const fi = parseInt(document.getElementById('mi-faixa')?.value)||0;
  if(!tipo) return;
  const aliq = SIMPLES[tipo].faixas[fi]?.reversa;
  if(aliq!==undefined){
    const aliqEl = document.getElementById('mi-aliq');
    if(aliqEl) aliqEl.value = +(aliq*100).toFixed(2);
  }
  miCalcUpdate();
}

function miCalcUpdate(){
  const g = id => parseFloat(document.getElementById(id)?.value)||0;
  const qty   = g('mi-qtd');
  const custo = g('mi-custo');
  const frete = g('mi-frete');
  const lucro = g('mi-margem') / 100;
  const aliq  = g('mi-aliq') / 100;
  const denom = 1 - aliq - lucro;
  const pmvEl = document.getElementById('mi-pmv');
  if(!pmvEl) return;
  if(denom <= 0 || custo + frete === 0){
    pmvEl.textContent = 'Verifique os valores';
    pmvEl.className = 'calc-pmv-value error';
    ['mi-r-custo','mi-r-imposto','mi-r-lucro','mi-r-total'].forEach(id=>{
      const el = document.getElementById(id); if(el) el.textContent='—';
    });
    return;
  }
  const pmv      = (custo + frete) / denom;
  const impostoR = pmv * aliq;
  const lucroR   = pmv * lucro;
  const total    = pmv * qty;
  pmvEl.textContent = brl(pmv);
  pmvEl.className   = 'calc-pmv-value';
  const set = (id, v) => { const el=document.getElementById(id); if(el) el.textContent=v; };
  set('mi-r-custo',   brl(custo + frete));
  set('mi-r-imposto', brl(impostoR));
  set('mi-r-lucro',   brl(lucroR));
  set('mi-r-total',   brl(total));
}

function acompItemModalSave(licId, itemId){
  const lic = acompData.find(x=>x.id===licId);
  if(!lic) return;
  if(!lic.itens) lic.itens = [];
  const g = id => document.getElementById(id)?.value || '';
  const aliqVal = parseFloat(g('mi-aliq'))||0;
  lic.aliq = aliqVal;
  const item = {
    id: itemId==='new' ? String(Date.now()) : itemId,
    num: Number(g('mi-num'))||0,
    fabricante: g('mi-fab'),
    produto: g('mi-prod'),
    valor_edital: parseFloat(g('mi-vedital'))||0,
    qtd: Number(g('mi-qtd'))||0,
    custo_unit: parseFloat(g('mi-custo'))||0,
    frete: parseFloat(g('mi-frete'))||0,
    margem: parseFloat(g('mi-margem'))||0,
    lance_min: parseFloat(g('mi-lance'))||0

  if(itemId==='new'){

function renderAcompDocs(lic){
  const wrap = document.getElementById('acomp-docs-wrap');
  if(!wrap) return;
  if(!lic.docsSelecionados) lic.docsSelecionados = [];
  const all = docsAllDocs();
  const sel = lic.docsSelecionados;

  let itemsHtml = '';
  if(sel.length === 0){
    itemsHtml = `<div class="docs-empty">Nenhum documento selecionado. Clique em "+ Selecionar documentos" para adicionar.</div>`;
  } else {
    sel.forEach(docId => {
      const doc = all.find(d => d.id === docId);
      if(!doc) return;
      const linkBtn = doc.link
        ? `<a class="docs-item-link" href="${escHtml(doc.link)}" target="_blank" rel="noopener">Consultar ↗</a>`
        : `<span class="docs-item-link" style="opacity:0.35;cursor:default">Sem link</span>`;
      itemsHtml += `<div class="docs-item">
        <span class="docs-item-name">${escHtml(doc.nome)}</span>
        ${linkBtn}
      </div>`;
    });
  }

  wrap.innerHTML = `<div class="docs-section">
    <div class="docs-header">
      <span class="docs-title">Documentos de Habilitação</span>
      <div class="docs-btns">
        <button class="acomp-btn" onclick="docsLibraryOpen()">Biblioteca regional</button>
        <button class="acomp-btn save" onclick="acompDocsOpenSelector('${lic.id}')">+ Selecionar documentos</button>
      </div>
    </div>
    <div class="docs-list">${itemsHtml}</div>
  </div>`;
}

function acompDocsOpenSelector(licId){
  const lic = acompData.find(x=>x.id===licId);
  if(!lic) return;
  if(!lic.docsSelecionados) lic.docsSelecionados = [];
  const all = docsAllDocs();

  const ckDocs = docsFromChecklist();
  const regional = docsLibrary;

  function docRow(doc){
    const on = lic.docsSelecionados.includes(doc.id);
    return `<div class="docs-sel-item" onclick="acompDocsToggle('${licId}','${doc.id}',this)">
      <span class="docs-sel-check${on?' on':''}">✓</span>
      <span>${escHtml(doc.nome)}</span>
    </div>`;
  }

  const grupos = [...new Set(ckDocs.map(d=>d.grupo))];
  let body = '';
  grupos.forEach(g=>{
    body += `<div class="docs-sel-group">${escHtml(g)}</div>`;
    ckDocs.filter(d=>d.grupo===g).forEach(d=>{ body += docRow(d); });
  });
  if(regional.length > 0){
    body += `<div class="docs-sel-group" style="margin-top:4px">Biblioteca Regional</div>`;
    regional.forEach(d=>{ body += docRow(d); });
  }

  const overlay = document.createElement('div');
  overlay.className = 'docs-sel-overlay';
  overlay.id = 'docs-sel-overlay';
  overlay.innerHTML = `<div class="docs-sel-modal">
    <div class="docs-sel-header">
      <span style="font-family:'Outfit';font-size:12px;font-weight:500;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)">Selecionar Documentos</span>
      <button class="icon-btn" onclick="document.getElementById('docs-sel-overlay').remove()">✕</button>
    </div>
    <div class="docs-sel-body">${body}</div>
    <div class="docs-sel-footer">
      <button class="acomp-btn" onclick="document.getElementById('docs-sel-overlay').remove()">Fechar</button>
    </div>
  </div>`;
  document.body.appendChild(overlay);
}

function acompDocsToggle(licId, docId, el){
  const lic = acompData.find(x=>x.id===licId);
  if(!lic) return;
  if(!lic.docsSelecionados) lic.docsSelecionados = [];
  const idx = lic.docsSelecionados.indexOf(docId);
  const check = el.querySelector('.docs-sel-check');
  if(idx >= 0){
    lic.docsSelecionados.splice(idx,1);
    if(check) check.classList.remove('on');
  } else {
    lic.docsSelecionados.push(docId);
    if(check) check.classList.add('on');
  }
  acompPersist();
  renderAcompDocs(lic);
}

function docsLibraryOpen(){
  const lib = docsLibrary;

  function libRows(){
    if(lib.length===0) return `<div class="docs-empty" style="padding:12px 0">Nenhum link regional cadastrado.</div>`;
    return lib.map(d => `<div class="docs-sel-item" style="gap:8px">
      <span style="flex:1">${escHtml(d.nome)}</span>
      ${d.link ? `<a href="${escHtml(d.link)}" target="_blank" rel="noopener" class="docs-item-link" style="font-size:11px">↗</a>` : ''}
      <button class="acomp-btn del" onclick="docsLibraryDelete('${d.id}')" style="padding:2px 8px;font-size:11px">Excluir</button>
    </div>`).join('');
  }

  const overlay = document.createElement('div');
  overlay.className = 'docs-sel-overlay';
  overlay.id = 'docs-lib-overlay';
  overlay.innerHTML = `<div class="docs-sel-modal">
    <div class="docs-sel-header">
      <span style="font-family:'Outfit';font-size:12px;font-weight:500;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)">Biblioteca de Links Regionais</span>
      <button class="icon-btn" onclick="document.getElementById('docs-lib-overlay').remove()">✕</button>

      ${libRows()}
      <div style="margin-top:16px;padding-top:16px;border-top:1px solid var(--line)">
        <div class="field-label" style="margin-bottom:8px">Adicionar novo documento regional</div>
        <div class="field-group" style="margin-bottom:8px">
          <input class="field-input" id="dlib-nome" type="text" placeholder="Nome do documento (ex: SEFAZ CE)">
        </div>
        <div class="field-group" style="margin-bottom:8px">
          <input class="field-input" id="dlib-link" type="url" placeholder="URL de consulta (opcional)">
        </div>
        <button class="acomp-btn save" onclick="docsLibraryAdd()">+ Adicionar</button>
      </div>
    </div>
    <div class="docs-sel-footer">
      <button class="acomp-btn" onclick="document.getElementById('docs-lib-overlay').remove()">Fechar</button>
    </div>
  </div>`;
  document.body.appendChild(overlay);
}

function docsLibraryAdd(){
  const nome = document.getElementById('dlib-nome')?.value?.trim();
  const link = document.getElementById('dlib-link')?.value?.trim();
  if(!nome){ alert('Informe o nome do documento.'); return; }
  const newDoc = { id:'reg-'+Date.now(), nome, link: link||'', tipo:'regional' };
  docsLibrary.push(newDoc);
  docsLibraryPersist();
  document.getElementById('docs-lib-overlay')?.remove();
  docsLibraryOpen();
}

function docsLibraryDelete(id){
  if(!confirm('Excluir este documento da biblioteca?')) return;
  const idx = docsLibrary.findIndex(d=>d.id===id);
  if(idx>=0){
    docsLibrary.splice(idx,1);
    docsLibraryPersist();
    acompData.forEach(lic=>{
      if(lic.docsSelecionados){
        lic.docsSelecionados = lic.docsSelecionados.filter(x=>x!==id);
      }
    });
    acompPersist();
  }
  document.getElementById('docs-lib-overlay')?.remove();
  docsLibraryOpen();
}

              <span class="ck-panel-label">Jurisprudência</span>

            </div>
            <div>
              <span class="ck-panel-label">Observações</span>
              <div class="ck-panel-content">${obsFormatted}</div>
            </div>
          </div>
        </div>
      </div>`;
    });
    html += `</div></div>`;
  });

function toggleGrupo(gi){
  const el = document.getElementById('grupo-'+gi);
  el.classList.toggle('collapsed');
}

function toggleItem(key, e){
  const el = document.getElementById('ck-'+key);
  el.classList.toggle('open');
}

function copyRecursoRec(key, btn){
  const box = document.getElementById('rec-'+key);
  const text = box.innerText||box.textContent;
  navigator.clipboard.writeText(text).then(()=>{
    const orig = btn.textContent;
    btn.textContent='Copiado ✓';
    btn.classList.add('copied');
    setTimeout(()=>{btn.textContent=orig;btn.classList.remove('copied');},2000);
  }).catch(()=>{
    const ta = document.createElement('textarea');
    ta.value=text;ta.style.position='fixed';ta.style.opacity='0';
    document.body.appendChild(ta);ta.select();document.execCommand('copy');
    document.body.removeChild(ta);
    btn.textContent='Copiado ✓';btn.classList.add('copied');
    setTimeout(()=>{btn.textContent='Copiar';btn.classList.remove('copied');},2000);
  });
}

function renderRecursos(){
  let html = `<div class="section-header">
    <div class="section-eyebrow"><span class="dot"></span>Desclassificar<span class="dot"></span>Textos Prontos</div>
    <h1 class="section-title">Recursos</h1>
    <p class="section-subtitle">Textos prontos para contestar cada tipo de documento. Clique em Copiar para usar.</p>
  </div>`;
  CHECKLIST.forEach((g,gi)=>{
    html += `<div class="recursos-grupo">
      <div class="recursos-grupo-title">${escHtml(g.secao)}</div>`;
    g.itens.forEach((item,ii)=>{
      const key = `${gi}-${ii}`;
      const savedRecurso = localStorage.getItem('recurso_'+key)||item.recurso;
      html += `<div class="recursos-item">
        <div class="recursos-item-tipo">${escHtml(item.tipo)}</div>
        <div class="ck-recurso-text" id="rec-${key}">${escHtml(savedRecurso)}</div>
        <div class="recursos-item-actions">
          <button class="ck-btn" onclick="copyRecursoRec('${key}',this)">Copiar</button>
        </div>
      </div>`;
    });
    html += `</div>`;
  });
  document.getElementById('main').innerHTML = html;
}

function filterChecklist(q){
  q=q.toLowerCase().trim();
  CHECKLIST.forEach((g,gi)=>{
    const grupo = document.getElementById('grupo-'+gi);
    if(!grupo) return;
    let grupoVisible=false;
    g.itens.forEach((item,ii)=>{
      const el = document.getElementById(`ck-${gi}-${ii}`);
      if(!el) return;
      const match = !q || item.tipo.toLowerCase().includes(q)||item.jurisprudencia.toLowerCase().includes(q)||item.observacoes.toLowerCase().includes(q);
      el.style.display=match?'':'none';
      if(match) grupoVisible=true;
    });
    grupo.style.display=grupoVisible?'':'none';
  });
}

function escHtml(s){
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
function escAttr(s){
  return String(s).replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}

function switchSection(section){
  currentSection=section;
  document.querySelectorAll('.nav-btn').forEach(b=>{
    b.classList.toggle('active', b.dataset.section===section);
  });
  document.getElementById('main').scrollTop=0;
  applySidebar();
  if(sidebarHidden && section!=='home') renderIconSidebar();
  else renderSidebar();
  if(section==='home') renderHome();
  else if(section==='desclassificar') renderDesclassificar();
  else if(section==='calculadora') renderCalculadora();
  else if(section==='editalreader') renderEditalReader();
  else if(section==='acompanhamento') renderAcompanhamento();
}

document.querySelectorAll('.nav-btn').forEach(btn=>{
  btn.addEventListener('click',()=>switchSection(btn.dataset.section));
});

function renderIconSidebar(){
  const sb = document.getElementById('sidebar');
  sb.classList.add('icon-mode');
  const sections = ['desclassificar','calculadora','editalreader','acompanhamento'];
  let html = `<div class="sb-icon-toggle"><button class="icon-btn" onclick="toggleSidebar()" title="Expandir barra lateral">${SIDEBAR_TOGGLE_SVG}</button></div>`;
  sections.forEach(s=>{
    const active = currentSection===s ? ' active' : '';
    html += `<button class="sb-icon-btn${active}" onclick="switchSection('${s}')" title="${SECTION_LABELS[s]}">${SECTION_ICONS[s]}</button>`;
  });
  sb.innerHTML = html;
}

function applySidebar(){
  const container = document.querySelector('.container');
  const isHome = currentSection === 'home';
  const sb = document.getElementById('sidebar');
  if(isHome){
    container.classList.add('sidebar-home');
    container.classList.remove('sidebar-off');
    sb.classList.remove('icon-mode');
    sb.innerHTML = '';
    return;
  }
  container.classList.remove('sidebar-home');
  if(sidebarHidden){
    container.classList.add('sidebar-off');
    renderIconSidebar();
  } else {
    container.classList.remove('sidebar-off');
    sb.classList.remove('icon-mode');
  }
}

function toggleSidebar(){
  if(currentSection === 'home') return;
  sidebarHidden = !sidebarHidden;
  localStorage.setItem('sidebar_hidden', sidebarHidden ? '1' : '0');
  if(sidebarHidden){
    applySidebar();
  } else {
    applySidebar();
    renderSidebar();
  }
}

function calcPopulateFaixas(){
  const tipo = document.getElementById('c-tipo').value;
  const sel = document.getElementById('c-faixa');
  sel.innerHTML = '';
  SIMPLES[tipo].faixas.forEach((f,i)=>{
    const opt = document.createElement('option');
    opt.value = i;
    opt.textContent = f.faixa + ' — reversa ' + pct(f.reversa);
    sel.appendChild(opt);
  });
  const aliq = SIMPLES[tipo].faixas[0].reversa;
  document.getElementById('c-aliquota').value = +(aliq*100).toFixed(2);
}

function calcTipoChange(){
  calcPopulateFaixas();
  calcUpdate();
}

function calcFaixaChange(){
  const tipo = document.getElementById('c-tipo').value;
  const fi   = parseInt(document.getElementById('c-faixa').value);
  const aliq = SIMPLES[tipo].faixas[fi].reversa;
  document.getElementById('c-aliquota').value = +(aliq*100).toFixed(2);
  calcUpdate();
}

function calcUpdate(){
  const qty    = parseFloat(document.getElementById('c-qty').value)    || 0;
  const custo  = parseFloat(document.getElementById('c-custo').value)  || 0;
  const frete  = parseFloat(document.getElementById('c-frete').value)  || 0;
  const lucro  = parseFloat(document.getElementById('c-lucro').value)  / 100 || 0;
  const aliq   = parseFloat(document.getElementById('c-aliquota').value) / 100 || 0;

  const tipo = document.getElementById('c-tipo').value;
  const fi   = parseInt(document.getElementById('c-faixa').value) || 0;
  const nominal = SIMPLES[tipo].faixas[fi] ? SIMPLES[tipo].faixas[fi].nominal : null;

  const denom = 1 - aliq - lucro;
  const pmvEl = document.getElementById('r-pmv');

  if(denom <= 0 || custo + frete === 0){
    pmvEl.textContent = 'Verifique os valores';
    pmvEl.className = 'calc-pmv-value error';
    ['r-custo-total','r-imposto','r-lucro','r-total','r-nominal'].forEach(id=>{
      document.getElementById(id).textContent = '—';
    });
    renderSimplesTables(-1,-1);
    return;
  }

  const pmv         = (custo + frete) / denom;
  const impostoR    = pmv * aliq;
  const lucroR      = pmv * lucro;
  const total       = pmv * qty;

  pmvEl.textContent = brl(pmv);
  pmvEl.className   = 'calc-pmv-value';
  document.getElementById('r-custo-total').textContent = brl(custo + frete);
  document.getElementById('r-imposto').textContent     = brl(impostoR);
  document.getElementById('r-lucro').textContent       = brl(lucroR);
  document.getElementById('r-nominal').textContent     = nominal !== null ? pct(nominal) : '—';
  document.getElementById('r-total').textContent       = brl(total);

  const tipoIdx = tipo === 'comercio' ? 0 : 1;
  renderSimplesTables(tipoIdx, fi);
}

function renderSimplesTables(activeTipo, activeFaixa){
  const wrap = document.getElementById('simples-tables');
  if(!wrap) return;
  const types = ['comercio','servico'];
  wrap.innerHTML = types.map((t,ti)=>{
    const d = SIMPLES[t];
    const rows = d.faixas.map((f,fi)=>{
      const sel = (ti===activeTipo && fi===activeFaixa) ? 'selected' : '';
      return `<tr class="${sel}" onclick="calcSelectFaixa('${t}',${fi})">
        <td>${f.faixa}</td>
        <td class="num">${pct(f.nominal)}</td>
        <td class="rev">${pct(f.reversa)}</td>
      </tr>`;
    }).join('');
    return `<div class="simples-table-wrap">
      <div class="simples-table-header">
        <div class="simples-table-title">${d.label}</div>
        <div class="simples-table-sub">Clique na faixa para aplicar na calculadora</div>
      </div>
      <table class="simples">
        <thead><tr><th>Faturamento anual</th><th style="text-align:right">Nominal</th><th style="text-align:right">Reversa</th></tr></thead>
        <tbody>${rows}</tbody>
      </table>
    </div>`;
  }).join('');
}

function calcSelectFaixa(tipo, fi){
  document.getElementById('c-tipo').value = tipo;
  calcPopulateFaixas();
  document.getElementById('c-faixa').value = fi;
  calcFaixaChange();
}

function brl(v){
  return v.toLocaleString('pt-BR',{style:'currency',currency:'BRL',minimumFractionDigits:2});
}
function pct(v){
  return (v*100).toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2})+'%';
}
