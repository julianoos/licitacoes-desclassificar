<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Desclassificar Concorrentes — Guia Operacional</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@200;300;400;500;600;700&display=swap">
<style>
:root {
  --bg: #0a0a0a;
  --surface: #141414;
  --surface-2: #1c1c1c;
  --ink: #f0f0f0;
  --ink-2: #d4d2c9;
  --muted: #888880;
  --muted-2: #555550;
  --line: #262626;
  --line-strong: #383838;
  --radius: 12px;
  --ease: cubic-bezier(0.22, 0.61, 0.36, 1);
  --shadow-hover: 0 12px 32px -12px rgba(0,0,0,0.7), 0 2px 6px -2px rgba(0,0,0,0.4);
}
html.light {
  --bg: #f4f3f0;
  --surface: #eceae5;
  --surface-2: #e4e2dc;
  --ink: #111110;
  --ink-2: #2e2d2a;
  --muted: #706f69;
  --muted-2: #a8a89f;
  --line: #d6d4ce;
  --line-strong: #bfbdb6;
  --shadow-hover: 0 12px 32px -12px rgba(0,0,0,0.12), 0 2px 6px -2px rgba(0,0,0,0.06);
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{transition:background 300ms var(--ease),color 300ms var(--ease)}
html,body{height:100%;background:var(--bg);color:var(--ink);font-family:'Outfit',system-ui,sans-serif;font-size:16px;line-height:1.6;-webkit-font-smoothing:antialiased;overflow:hidden}

/* ─── APP SHELL ─── */
.app{display:flex;flex-direction:column;height:100vh}

/* ─── TOPBAR ─── */
.topbar{
  position:relative;z-index:20;
  display:flex;align-items:center;justify-content:space-between;
  padding:clamp(14px,2vh,22px) clamp(24px,3vw,56px);
  border-bottom:1px solid var(--line);
  background:var(--bg);
  flex-shrink:0;
}
.brand{
  font-family:'Outfit',sans-serif;font-weight:500;font-size:clamp(13px,1vw,16px);
  letter-spacing:0.06em;text-transform:uppercase;color:var(--ink);
}
.brand span{color:var(--muted);margin-left:6px;font-weight:300}
.nav-group{display:flex;gap:8px}
.nav-btn{
  appearance:none;background:transparent;
  border:1px solid var(--line);color:var(--muted);
  font-family:'Outfit',sans-serif;font-size:11px;font-weight:500;
  letter-spacing:0.14em;text-transform:uppercase;
  padding:9px clamp(16px,1.4vw,24px);border-radius:var(--radius);
  cursor:pointer;min-width:100px;
  transition:background 220ms var(--ease),border-color 220ms var(--ease),color 220ms var(--ease),transform 160ms var(--ease);
}
.nav-btn:hover{background:var(--surface-2);border-color:var(--line-strong);color:var(--ink)}
.nav-btn.active{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.nav-btn:active{transform:scale(0.97)}

/* ─── THEME TOGGLE ─── */
.theme-toggle{
  appearance:none;background:transparent;
  border:1px solid var(--line);color:var(--muted);
  font-family:'Outfit',sans-serif;font-size:11px;font-weight:500;
  letter-spacing:0.12em;text-transform:uppercase;
  padding:9px 14px;border-radius:var(--radius);
  cursor:pointer;display:flex;align-items:center;gap:7px;
  transition:background 220ms var(--ease),border-color 220ms var(--ease),color 220ms var(--ease),transform 160ms var(--ease);
  flex-shrink:0;
}
.theme-toggle:hover{background:var(--surface-2);border-color:var(--line-strong);color:var(--ink)}
.theme-toggle:active{transform:scale(0.97)}
.theme-toggle svg{width:14px;height:14px;flex-shrink:0}
.topbar-right{display:flex;align-items:center;gap:8px}

/* ─── CONTAINER ─── */
.container{display:grid;grid-template-columns:220px 1fr;flex:1;overflow:hidden}
@media(max-width:768px){.container{grid-template-columns:1fr}.sidebar{display:none}}

/* ─── SIDEBAR ─── */
.sidebar{
  border-right:1px solid var(--line);overflow-y:auto;
  padding:clamp(20px,3vh,32px) 0;
  scrollbar-width:thin;scrollbar-color:var(--line) transparent;
}
.sidebar-section-title{
  font-size:10px;letter-spacing:0.2em;text-transform:uppercase;
  color:var(--muted-2);padding:0 20px 10px;font-weight:500;
}
.sidebar-link{
  display:block;padding:8px 20px;
  font-size:13px;font-weight:400;color:var(--muted);
  cursor:pointer;text-decoration:none;
  transition:color 200ms var(--ease),padding-left 200ms var(--ease),background 200ms var(--ease);
  border-left:2px solid transparent;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.sidebar-link:hover{color:var(--ink-2);padding-left:26px;background:rgba(240,240,240,0.03)}
.sidebar-link.active{color:var(--ink);border-left-color:var(--ink);padding-left:26px}
.sidebar-divider{height:1px;background:var(--line);margin:12px 20px}

/* ─── MAIN ─── */
.main{overflow-y:auto;padding:clamp(28px,4vh,52px) clamp(24px,4vw,64px);scrollbar-width:thin;scrollbar-color:var(--line) transparent}
.section-header{margin-bottom:clamp(28px,4vh,48px)}
.section-eyebrow{
  display:inline-flex;align-items:center;gap:8px;
  font-size:10px;letter-spacing:0.2em;text-transform:uppercase;
  color:var(--muted);font-weight:500;margin-bottom:16px;
}
.section-eyebrow .dot{width:3px;height:3px;background:var(--muted);border-radius:50%;flex-shrink:0}
.section-title{
  font-family:'Outfit',sans-serif;font-weight:200;
  font-size:clamp(32px,4vw,56px);letter-spacing:-0.04em;
  color:var(--ink);line-height:1.05;
}
.section-subtitle{
  font-size:14px;color:var(--muted);font-weight:300;margin-top:12px;
  max-width:60ch;line-height:1.7;
}

/* ─── TEORIA ACCORDIONS ─── */
.topico{border-bottom:1px solid var(--line)}
.topico:first-child{border-top:1px solid var(--line)}
.topico-header{
  display:flex;align-items:baseline;gap:20px;
  padding:clamp(18px,2.5vh,28px) 0;
  cursor:pointer;
  transition:color 200ms var(--ease);
  user-select:none;
}
.topico-header:hover .topico-titulo{color:var(--ink)}
.topico-num{
  font-family:'Outfit',sans-serif;font-weight:200;
  font-size:clamp(13px,1vw,15px);color:var(--muted-2);
  min-width:32px;letter-spacing:0.04em;flex-shrink:0;
}
.topico-titulo{
  font-family:'Outfit',sans-serif;font-weight:300;
  font-size:clamp(16px,1.5vw,22px);letter-spacing:-0.01em;
  color:var(--ink-2);flex:1;
  transition:color 200ms var(--ease);
}
.topico-arrow{
  margin-left:auto;font-size:12px;color:var(--muted-2);flex-shrink:0;
  transition:transform 320ms var(--ease);
}
.topico.open .topico-arrow{transform:rotate(180deg)}
.topico-body{
  max-height:0;overflow:hidden;
  transition:max-height 500ms var(--ease);
}
.topico.open .topico-body{max-height:6000px}
.topico-content{
  padding:0 0 clamp(24px,3vh,36px) 52px;
  font-size:14px;color:var(--ink-2);line-height:1.8;font-weight:300;
}
.topico-content p{margin-bottom:14px}
.topico-content p:last-child{margin-bottom:0}
.topico-content strong{color:var(--ink);font-weight:500}
.topico-content ul{padding-left:18px;margin:10px 0}
.topico-content ul li{margin-bottom:8px}
.topico-content ol{padding-left:18px;margin:10px 0}
.topico-content ol li{margin-bottom:8px}
.callout{
  background:var(--surface);border-left:3px solid var(--line-strong);
  border-radius:0 var(--radius) var(--radius) 0;
  padding:16px 20px;margin:16px 0;font-size:13px;line-height:1.7;
}
.callout.alert{border-left-color:var(--ink)}
.callout-label{font-size:10px;letter-spacing:0.18em;text-transform:uppercase;color:var(--muted);display:block;margin-bottom:8px;font-weight:500}
.grid-3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:16px 0}
@media(max-width:900px){.grid-3{grid-template-columns:1fr}}
.mini-card{
  background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);
  padding:16px 18px;
}
.mini-card-label{font-size:10px;letter-spacing:0.16em;text-transform:uppercase;color:var(--muted);font-weight:500;margin-bottom:8px;display:block}
.mini-card-title{font-size:14px;font-weight:500;color:var(--ink);margin-bottom:6px}
.mini-card-body{font-size:13px;color:var(--muted);line-height:1.6}
.tag{
  display:inline-block;padding:3px 10px;
  font-size:10px;font-weight:500;letter-spacing:0.12em;text-transform:uppercase;
  border:1px solid var(--line-strong);border-radius:20px;color:var(--muted);margin-right:6px;margin-bottom:4px;
}
.jurisprudencia-list{display:flex;flex-direction:column;gap:12px;margin:12px 0}
.juri-item{
  background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:16px 18px;
  transition:border-color 200ms var(--ease);
}
.juri-item:hover{border-color:var(--line-strong)}
.juri-item-ref{font-size:11px;letter-spacing:0.1em;text-transform:uppercase;color:var(--muted);font-weight:500;margin-bottom:6px}
.juri-item-text{font-size:13px;color:var(--ink-2);line-height:1.65}
.checklist-30{display:flex;flex-direction:column;gap:10px;margin:12px 0}
.passo{
  display:grid;grid-template-columns:42px 1fr;align-items:start;gap:16px;
  background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:16px 18px;
}
.passo-num{font-family:'Outfit',sans-serif;font-weight:200;font-size:22px;color:var(--muted-2);line-height:1;padding-top:2px}
.passo-text{font-size:13px;color:var(--ink-2);line-height:1.6}
.passo-text strong{color:var(--ink);font-weight:500}

/* ─── LEGISLACAO ─── */
.artigo{
  background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);
  padding:clamp(22px,3vh,36px) clamp(20px,2.5vw,36px);
  margin-bottom:16px;
  transition:border-color 240ms var(--ease);
  scroll-margin-top:80px;
}
.artigo:hover{border-color:var(--line-strong)}
.artigo-eyebrow{
  font-size:10px;letter-spacing:0.18em;text-transform:uppercase;
  color:var(--muted);font-weight:500;margin-bottom:10px;
  display:flex;align-items:center;gap:8px;
}
.artigo-titulo{
  font-family:'Outfit',sans-serif;font-weight:300;
  font-size:clamp(17px,1.6vw,24px);letter-spacing:-0.01em;
  color:var(--ink);margin-bottom:18px;
}
.artigo-link{
  display:inline-flex;align-items:center;gap:8px;
  font-size:12px;letter-spacing:0.1em;text-transform:uppercase;font-weight:500;
  color:var(--muted);text-decoration:none;
  border:1px solid var(--line);border-radius:var(--radius);
  padding:8px 16px;margin-bottom:16px;
  transition:background 200ms var(--ease),border-color 200ms var(--ease),color 200ms var(--ease);
}
.artigo-link:hover{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.artigo-texto{font-size:13.5px;color:var(--ink-2);line-height:1.9;font-weight:300;white-space:pre-wrap}
.artigo-texto .inciso{padding-left:0;display:block;margin:4px 0}
.artigo-texto .paragrafo{display:block;margin:8px 0;padding-left:0}
.artigo-texto strong{color:var(--ink);font-weight:500}

/* ─── CHECKLIST ─── */
.ck-search-wrap{margin-bottom:28px}
.ck-search{
  width:100%;background:var(--surface);border:1px solid var(--line);
  border-radius:var(--radius);padding:13px 18px;
  font-family:'Outfit',sans-serif;font-size:14px;font-weight:300;color:var(--ink);
  outline:none;transition:border-color 220ms var(--ease);
}
.ck-search::placeholder{color:var(--muted-2)}
.ck-search:focus{border-color:var(--line-strong)}
.grupo{margin-bottom:32px;scroll-margin-top:80px}
.grupo-header{
  display:flex;align-items:center;gap:16px;
  cursor:pointer;padding:14px 0;border-bottom:1px solid var(--line);margin-bottom:8px;
  user-select:none;
}
.grupo-eyebrow{
  font-size:10px;letter-spacing:0.18em;text-transform:uppercase;
  color:var(--muted-2);font-weight:500;flex:1;
}
.grupo-count{font-size:11px;color:var(--muted-2)}
.grupo-chevron{font-size:10px;color:var(--muted-2);transition:transform 280ms var(--ease)}
.grupo.collapsed .grupo-chevron{transform:rotate(-90deg)}
.grupo-items{transition:opacity 200ms var(--ease)}
.grupo.collapsed .grupo-items{display:none}
.ck-item{border-bottom:1px solid var(--line)}
.ck-item-header{
  display:flex;align-items:center;gap:14px;
  padding:13px 0;cursor:pointer;
  transition:padding-left 200ms var(--ease);
  user-select:none;
}
.ck-item-header:hover{padding-left:8px}
.ck-check{
  width:18px;height:18px;border:1px solid var(--line-strong);border-radius:4px;
  display:flex;align-items:center;justify-content:center;flex-shrink:0;
  font-size:10px;color:transparent;
  transition:background 200ms var(--ease),border-color 200ms var(--ease),color 200ms var(--ease);
  cursor:pointer;
}
.ck-check.checked{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.ck-item-titulo{font-size:14px;color:var(--ink-2);font-weight:300;flex:1;line-height:1.4}
.ck-item-badge{
  font-size:9px;letter-spacing:0.12em;text-transform:uppercase;font-weight:500;
  color:var(--muted-2);border:1px solid var(--line);border-radius:20px;padding:3px 9px;flex-shrink:0;
}
.ck-item-arrow{font-size:10px;color:var(--muted-2);transition:transform 280ms var(--ease);flex-shrink:0}
.ck-item.open .ck-item-arrow{transform:rotate(180deg)}
.ck-expand{max-height:0;overflow:hidden;transition:max-height 400ms var(--ease)}
.ck-item.open .ck-expand{max-height:2000px}
.ck-panels{padding:4px 0 20px 32px;display:flex;flex-direction:column;gap:14px}
.ck-panel-label{
  font-size:10px;letter-spacing:0.16em;text-transform:uppercase;
  color:var(--muted);font-weight:500;margin-bottom:8px;display:block;
}
.ck-panel-content{
  background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:14px 16px;
  font-size:13px;color:var(--ink-2);line-height:1.7;font-weight:300;
}
.ck-recurso-wrap{position:relative}
.ck-recurso-actions{
  display:flex;gap:8px;margin-bottom:10px;
}
.ck-btn{
  appearance:none;background:transparent;
  border:1px solid var(--line);color:var(--muted);
  font-family:'Outfit',sans-serif;font-size:10px;font-weight:500;
  letter-spacing:0.12em;text-transform:uppercase;
  padding:6px 14px;border-radius:var(--radius);cursor:pointer;
  transition:background 180ms var(--ease),border-color 180ms var(--ease),color 180ms var(--ease);
}
.ck-btn:hover{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.ck-btn.copied{border-color:var(--line-strong);color:var(--ink)}
.ck-recurso-text{
  background:var(--surface-2);border:1px solid var(--line);
  border-left:3px solid var(--line-strong);
  border-radius:0 var(--radius) var(--radius) 0;
  padding:16px 18px;font-size:13px;color:var(--ink-2);
  line-height:1.85;font-weight:300;white-space:pre-wrap;
  outline:none;cursor:default;
  transition:border-left-color 200ms var(--ease),background 200ms var(--ease);
}
.ck-recurso-text[contenteditable="true"]{
  border-left-color:var(--ink);background:var(--surface);cursor:text;
}
.ck-empty{text-align:center;color:var(--muted-2);padding:48px 24px;font-size:14px}

/* ─── SCROLLBAR ─── */
::-webkit-scrollbar{width:4px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--line-strong);border-radius:2px}

/* ─── CALCULADORA ─── */
.calc-layout{display:grid;grid-template-columns:1fr 340px;gap:32px;align-items:start}
@media(max-width:1000px){.calc-layout{grid-template-columns:1fr}}

.calc-form-card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:clamp(22px,3vh,36px) clamp(20px,2.5vw,32px)}
.calc-form-title{font-size:11px;letter-spacing:0.2em;text-transform:uppercase;color:var(--muted);font-weight:500;margin-bottom:20px}

.field-group{margin-bottom:18px}
.field-label{display:block;font-size:11px;letter-spacing:0.14em;text-transform:uppercase;color:var(--muted);font-weight:500;margin-bottom:8px}
.field-hint{font-size:11px;color:var(--muted-2);margin-top:5px;font-weight:300}
.field-input{
  width:100%;background:var(--bg);border:1px solid var(--line);border-radius:8px;
  color:var(--ink);font-family:'Outfit',sans-serif;font-size:15px;font-weight:400;
  padding:10px 14px;transition:border-color 200ms var(--ease),box-shadow 200ms var(--ease);
  appearance:none;
}
.field-input:focus{outline:none;border-color:var(--line-strong);box-shadow:0 0 0 3px rgba(240,240,240,0.06)}
.field-input::placeholder{color:var(--muted-2)}
.field-row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.field-select{
  width:100%;background:var(--bg);border:1px solid var(--line);border-radius:8px;
  color:var(--ink);font-family:'Outfit',sans-serif;font-size:14px;font-weight:400;
  padding:10px 14px;cursor:pointer;
  transition:border-color 200ms var(--ease);
}
.field-select:focus{outline:none;border-color:var(--line-strong)}

.calc-result-card{
  background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);
  padding:clamp(22px,3vh,36px) clamp(20px,2.5vw,32px);
  position:sticky;top:24px;
}
.calc-result-label{font-size:10px;letter-spacing:0.2em;text-transform:uppercase;color:var(--muted);font-weight:500;margin-bottom:6px}
.calc-pmv-value{
  font-family:'Outfit',sans-serif;font-weight:200;
  font-size:clamp(36px,4vw,52px);letter-spacing:-0.04em;
  color:var(--ink);line-height:1;margin-bottom:24px;
}
.calc-pmv-value.error{font-size:16px;font-weight:400;color:var(--muted);letter-spacing:0}
.calc-breakdown{display:flex;flex-direction:column;gap:10px;margin-bottom:20px}
.calc-row{display:flex;justify-content:space-between;align-items:baseline;gap:8px;padding:10px 0;border-bottom:1px solid var(--line)}
.calc-row:last-child{border-bottom:none}
.calc-row-label{font-size:13px;color:var(--muted);font-weight:300}
.calc-row-value{font-size:15px;color:var(--ink);font-weight:400;letter-spacing:-0.01em;white-space:nowrap}
.calc-total-row{
  background:var(--surface-2);border-radius:8px;
  padding:14px 16px;display:flex;justify-content:space-between;align-items:center;
  margin-top:8px;
}
.calc-total-label{font-size:11px;letter-spacing:0.14em;text-transform:uppercase;color:var(--muted);font-weight:500}
.calc-total-value{font-size:20px;font-weight:500;color:var(--ink);letter-spacing:-0.02em}

.calc-section{margin-top:40px}
.calc-section-title{font-size:11px;letter-spacing:0.2em;text-transform:uppercase;color:var(--muted);font-weight:500;margin-bottom:16px}

.callout-info{
  background:var(--surface);border-left:3px solid var(--line-strong);
  border-radius:0 var(--radius) var(--radius) 0;
  padding:16px 20px;margin-bottom:28px;font-size:13px;line-height:1.75;color:var(--ink-2);font-weight:300;
}
.callout-info strong{color:var(--ink);font-weight:500}

.simples-grid{display:grid;grid-template-columns:1fr 1fr;gap:20px}
@media(max-width:900px){.simples-grid{grid-template-columns:1fr}}
.simples-table-wrap{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden}
.simples-table-header{padding:14px 18px;border-bottom:1px solid var(--line)}
.simples-table-title{font-size:12px;font-weight:500;letter-spacing:0.08em;text-transform:uppercase;color:var(--ink)}
.simples-table-sub{font-size:11px;color:var(--muted);font-weight:300;margin-top:2px}
table.simples{width:100%;border-collapse:collapse;font-size:12px}
table.simples thead th{padding:8px 18px;text-align:left;font-size:10px;letter-spacing:0.14em;text-transform:uppercase;color:var(--muted);font-weight:500;border-bottom:1px solid var(--line)}
table.simples tbody tr{cursor:pointer;transition:background 150ms}
table.simples tbody tr:hover{background:var(--surface-2)}
table.simples tbody tr.selected{background:var(--surface-2)}
table.simples tbody tr.selected td:first-child::before{content:'→ ';color:var(--ink);font-weight:600}
table.simples td{padding:10px 18px;color:var(--ink-2);border-bottom:1px solid var(--line)}
table.simples tbody tr:last-child td{border-bottom:none}
table.simples td.num{color:var(--ink);font-weight:400;text-align:right;font-variant-numeric:tabular-nums}
table.simples td.rev{color:var(--ink);font-weight:500;text-align:right;font-variant-numeric:tabular-nums}
</style>
</head>
<body>

const TEORIA = [
{
  id:'intro',
  titulo:'Introdução',
  conteudo:`<p>O que se chama de <strong>"desclassificar concorrente"</strong> no jargão de licitante é, na prática, acionar dentro do prazo os mecanismos legais que a Lei 14.133/2021 oferece — impugnação ao edital, manifestação de intenção de recurso, recurso administrativo, contrarrazões, representação aos órgãos de controle. <strong>Não é truque, é processo.</strong></p>

<div class="callout alert"><span class="callout-label">⚠ Atenção — Art. 155 da Lei 14.133</span>Quem trata como truque (forja documento, faz denúncia caluniosa, espalha falsa informação sobre concorrente) paga <strong>multa de até 30% do valor do contrato</strong>, fica <strong>até 6 anos impedido de licitar</strong> e pode responder criminalmente (Arts. 337-E a 337-P do Código Penal). Pior negócio possível.</div>

<p>Toda estratégia válida se apoia em três pilares: (1) <strong>conhecer o que a lei exige</strong> do concorrente em cada fase, (2) <strong>verificar tecnicamente</strong> se ele cumpriu, e (3) <strong>registrar por escrito</strong> o argumento com citação legal dentro do prazo.</p>`
},
{
  id:'instrumentos',
  titulo:'Os Três Instrumentos',
  conteudo:`<p>Existem três momentos e mecanismos distintos para contestar um concorrente:</p>

<div class="grid-3">
<div class="mini-card"><span class="mini-card-label">Instrumento 01</span><div class="mini-card-title">Impugnação ao Edital</div><div class="mini-card-body">Prazo: até 3 dias úteis antes da abertura (Art. 164). Ataca cláusula restritiva ou ilegal antes da disputa.</div></div>
<div class="mini-card"><span class="mini-card-label">Instrumento 02</span><div class="mini-card-title">Desclassificação</div><div class="mini-card-body">Ataca a <strong>proposta</strong>: preço, planilha, marca, amostra. Base: Art. 59. Via recurso (Art. 165).</div></div>
<div class="mini-card"><span class="mini-card-label">Instrumento 03</span><div class="mini-card-title">Inabilitação</div><div class="mini-card-body">Ataca os <strong>documentos</strong> do concorrente: habilitação jurídica, fiscal, técnica, econômica. Base: Arts. 62-70.</div></div>
</div>

<p>Desclassificação e Inabilitação são contestadas via <strong>manifestação de intenção de recurso + recurso administrativo</strong> (Art. 165). O prazo para intenção é de 3 dias úteis após a declaração do vencedor.</p>

<div class="callout"><span class="callout-label">Regra de ouro</span>Habilitação documental vence mais fácil que discussão de proposta. Certidão vencida é quase automático; discussão de especificação técnica depende de análise do pregoeiro.</div>`
},
{
  id:'impugnacao',
  titulo:'Impugnação ao Edital',
  conteudo:`<p>Você <strong>não precisa esperar perder</strong> para agir. Se o edital tem cláusula que protege um concorrente específico, você impugna antes. Prazo: até 3 dias úteis antes da abertura da sessão (Art. 164).</p>

<p><strong>Pontos clássicos que rendem impugnação procedente:</strong></p>
<ul>
<li>Atestado de capacidade técnica com quantitativos acima de 50% das parcelas de maior relevância — Art. 67, §2° limita a esse percentual.</li>
<li>Indicação de marca sem se enquadrar nas hipóteses do Art. 41, I (padronização, compatibilidade, marca única, ou referência com "ou similar").</li>
<li>Vedação à participação de empresas em recuperação judicial sem análise individualizada — TCU já derrubou várias vezes.</li>
<li>Exigência de documentos fora do rol legal dos Arts. 62 a 70 (rol taxativo).</li>
<li>Vistoria conjunta obrigatória — vedada pelo TCU porque permite identificação prévia entre licitantes.</li>
</ul>

<div class="callout alert"><span class="callout-label">Acórdão 7289/2022-TCU</span>O agente de contratação tem o <strong>dever de revisar cláusula restritiva mesmo quando a impugnação não é conhecida formalmente</strong>. Se o ponto for procedente, ele é obrigado a corrigir de ofício. O erro formal da licitante não "limpa" a ilegalidade do edital.</div>

<p><strong>Três cenários:</strong></p>
<ul>
<li><strong>Impugnação no prazo e procedente:</strong> Acolhe, corrige o edital e republica.</li>
<li><strong>Impugnação fora do prazo, mas com razão:</strong> Não conhece formalmente, mas corrige de ofício.</li>
<li><strong>Impugnação fora do prazo e sem razão:</strong> Não conhece e segue o processo.</li>
</ul>`
},
{
  id:'descl59',
  titulo:'Desclassificação — Art. 59',
  conteudo:`<p>O Art. 59 da Lei 14.133 lista <strong>cinco causas</strong> para desclassificação de proposta:</p>
<ol>
<li><strong>Vícios insanáveis</strong> — alteração de termos do edital, identificação indevida do licitante na fase competitiva, proposta incompleta em elemento essencial.</li>
<li><strong>Desconformidade com o objeto</strong> — produto/serviço ofertado não atende especificação técnica do Termo de Referência.</li>
<li><strong>Preço inexequível ou acima do orçamento estimado.</strong></li>
<li><strong>Exequibilidade não demonstrada</strong> quando exigida (concorrente foi diligenciado e não comprovou viabilidade).</li>
<li><strong>Desconformidade com outras exigências do edital</strong>, desde que insanável.</li>
</ol>

<p><strong>Pontos práticos de ataque à proposta:</strong></p>
<ul>
<li><strong>Especificação técnica incompatível com o TR</strong> — cruzar catálogo/datasheet ofertado linha por linha. Fonte mais rica em licitação de bens.</li>
<li><strong>Marca cotada fora de linha ou sem atender referência técnica</strong> — cabe diligência; não confirmado, desclassifica por desconformidade.</li>
<li><strong>Erro entre preço unitário e total</strong> — sanável por diligência; se não responder à diligência, desclassifica.</li>
<li><strong>Identificação indevida do licitante</strong> na fase de propostas (logo, marca d'água, nome) — vício insanável.</li>
<li><strong>Recusa em apresentar amostra</strong> ou prova de conceito quando exigida no edital.</li>
</ul>`
},
{
  id:'inexequivel',
  titulo:'Inexequibilidade — Ponto mais disputado',
  conteudo:`<p>Estado da arte (TCU, Acórdão 465/2024-Plenário, e Súmula 262 reafirmada): <strong>inexequibilidade é presunção relativa</strong>. A Lei e o Decreto 11.462/2023 estabelecem limites que disparam investigação, mas não desclassificação imediata.</p>

<div class="grid-3">
<div class="mini-card"><span class="mini-card-label">Obras / Engenharia</span><div class="mini-card-title">Gatilho: abaixo de 75%</div><div class="mini-card-body">Do orçamento estimado. Pregoeiro deve solicitar diligência antes de desclassificar.</div></div>
<div class="mini-card"><span class="mini-card-label">Bens e Serviços Comuns</span><div class="mini-card-title">Gatilho: abaixo de 50%</div><div class="mini-card-body">Do orçamento estimado. Inversão do ônus da prova: concorrente deve comprovar viabilidade.</div></div>
<div class="mini-card"><span class="mini-card-label">Acima do limite</span><div class="mini-card-title">Presumido viável</div><div class="mini-card-body">Aceita direto. Administração que quer desclassificar precisa provar inviabilidade.</div></div>
</div>

<div class="callout alert"><span class="callout-label">Tática — para derrubar o concorrente</span>Se o concorrente caiu no gatilho (abaixo de 50%) e o pregoeiro <strong>não pediu diligência</strong>, argumente no recurso que violou o Art. 59, §2° (obrigação de diligenciar). Se pediu diligência mas aceitou resposta fraca (genérica, sem números), ataque apontando falta de análise técnica.</div>

<div class="callout"><span class="callout-label">Dica de ouro</span>Se você estiver disputando algo que não é engenharia e o pregoeiro tentar usar o limite de 75% para te desclassificar, ele está errando. Para bens e serviços comuns, o limite é 50%. Esse argumento garante sua permanência se sua planilha for sólida.</div>

<p>O que comprovar se você for o diligenciado: planilha analítica de custos, comprovação de parcerias/fornecedores (NFs, contratos), diferenças tributárias, eficiência operacional ou logística.</p>`
},
{
  id:'fiscal',
  titulo:'Habilitação Fiscal — Art. 68',
  conteudo:`<p>Esta é a fase em que mais se "ganha licitação sem baixar preço". O rol de exigências é taxativo e qualquer deslize documental é praticamente automático.</p>

<p><strong>Regra:</strong> certidão válida na <strong>data da habilitação</strong>. Documento vencido antes do recebimento das propostas é vício material e não se sana por diligência; vencido depois pode ser atualizado (Art. 64).</p>

<p><strong>Cinco certidões mínimas:</strong></p>
<ul>
<li><strong>CND Federal conjunta</strong> (Receita Federal + PGFN, inclui INSS desde 2014). Validade: 180 dias.</li>
<li><strong>CND Estadual</strong> — Fazenda Estadual do domicílio. No Ceará: SEFAZ-CE, validade 60 dias.</li>
<li><strong>CND Municipal</strong> — Fazenda Municipal do domicílio. Validade típica: 60-90 dias. <strong>Empresa de município pequeno frequentemente esquece — é ataque clássico.</strong></li>
<li><strong>CRF/FGTS</strong> — Caixa Econômica. Validade: 30 dias.</li>
<li><strong>CNDT</strong> — Certidão Negativa de Débitos Trabalhistas (TST). Validade: 180 dias.</li>
</ul>

<div class="callout alert"><span class="callout-label">Armadilha mais comum</span>Certidão <strong>positiva com efeito de negativa vale como negativa</strong>. Se você for atacar, confirme que é positiva pura — não positiva com efeito de negativa. Essa confusão mata o recurso.</div>`
},
{
  id:'falencia',
  titulo:'Falência e Recuperação Judicial',
  conteudo:`<p>A certidão de falência, recuperação judicial e concordata é emitida pelo Cartório Distribuidor da Comarca do domicílio da empresa. Faz parte da habilitação econômico-financeira (Art. 69, II).</p>

<p>A Lei 14.133 mudou em relação à 8.666:</p>
<ul>
<li><strong>Empresa em recuperação judicial pode participar</strong>, desde que apresente plano de recuperação homologado e demonstre capacidade econômico-financeira (Art. 69, §1°).</li>
<li><strong>Falência decretada, sim, impede.</strong></li>
<li>Cláusula de edital que veda automaticamente empresa em recuperação é <strong>restritiva e impugnável</strong> — TCU já firmou isso.</li>
</ul>

<div class="callout"><span class="callout-label">Ponto de ataque</span>Se a empresa estiver em recuperação mas não apresentou plano homologado ou não demonstrou capacidade econômico-financeira, há fundamento para inabilitação mesmo sem falência decretada.</div>`
},
{
  id:'balanco',
  titulo:'Balanço Patrimonial e Índices',
  conteudo:`<p>O Art. 69, I da Lei 14.133 exige apresentação de balanço patrimonial do último exercício social. O edital define os índices contábeis exigidos, seguindo o padrão do Decreto 11.462/2023 e a IN SEGES/MGI 2/2023:</p>

<ul>
<li><strong>Liquidez Geral (LG)</strong> = (Ativo Circulante + Realizável a Longo Prazo) ÷ (Passivo Circulante + Passivo Não Circulante). Exigência típica: ≥ 1,0.</li>
<li><strong>Liquidez Corrente (LC)</strong> = Ativo Circulante ÷ Passivo Circulante. Exigência típica: ≥ 1,0.</li>
<li><strong>Solvência Geral (SG)</strong> = Ativo Total ÷ (Passivo Circulante + Passivo Não Circulante). Exigência típica: ≥ 1,0.</li>
</ul>

<div class="callout"><span class="callout-label">Importante — não festeje cedo</span>Empresa que apresenta índice inferior a 1 <strong>não cai automaticamente</strong>. A lei e a maioria dos editais permitem que o licitante comprove <strong>patrimônio líquido mínimo de 10% do valor estimado do contrato</strong> como alternativa. Antes de comemorar que o concorrente tem LC=0,8, confira se ele atende o PL mínimo.</div>

<p><strong>Ataques mais sólidos no balanço:</strong></p>
<ul>
<li>Balanço sem registro na Junta Comercial (ou ECD não transmitida à Receita).</li>
<li>Sem assinatura digital do contador.</li>
<li>Contador com CRC vencido.</li>
<li>Formato diferente do exigido (Sped/ECD vs PDF).</li>
</ul>

<p>Para empresa nova criada no exercício, a Lei 14.133 admite balanço de abertura (Art. 65, §1°).</p>`
},
{
  id:'atestado',
  titulo:'Atestado de Capacidade Técnica',
  conteudo:`<p>Base: Art. 67. Os cinco pontos de verificação:</p>
<ul>
<li><strong>Quantitativo:</strong> o edital pode exigir até 50% das parcelas de maior relevância (Art. 67, §2°). Atestado abaixo disso inabilita.</li>
<li><strong>Compatibilidade do objeto:</strong> atestado tem que ser de objeto similar, não genérico. Atestado de "serviços de informática" não vale para licitação específica de manutenção de impressoras.</li>
<li><strong>Emitente identificável:</strong> nome, CNPJ, endereço, telefone, responsável. Atestado sem dado de contato é inválido — não dá para diligenciar.</li>
<li><strong>Registro no conselho profissional:</strong> quando exigido (CREA para engenharia, CRA para administração, CRC para contabilidade), o atestado precisa ter visto da entidade.</li>
<li><strong>Verificação:</strong> ligue para o emitente. Acórdão 29/2024-TCU pegou caso de atestado com data anterior à fundação da empresa atestada.</li>
</ul>

<div class="callout alert"><span class="callout-label">Acórdão 29/2024-TCU</span>Atestado de capacidade técnica com data anterior à fundação da empresa atestada é falso. Gera inidoneidade tanto da empresa emitente quanto da apresentante.</div>`
},
{
  id:'certidoes',
  titulo:'Certidões — CEIS, CNEP, CEPIM, TCU',
  conteudo:`<ul>
<li><strong>CEIS</strong> (Cadastro de Empresas Inidôneas e Suspensas) — Portal da Transparência (CGU). Lista empresas com sanção administrativa que impede licitar.</li>
<li><strong>CNEP</strong> (Cadastro Nacional de Empresas Punidas) — também CGU. Sanções decorrentes da Lei Anticorrupção (12.846/2013).</li>
<li><strong>CEPIM</strong> (Cadastro de Entidades Privadas sem Fins Lucrativos Impedidas) — relevante se você licita contra ONG.</li>
<li><strong>Cadastro de Inidôneos do TCU</strong> — base própria do TCU, separada da CGU.</li>
<li><strong>CADIN</strong> (Cadastro Informativo de Créditos não Quitados) — Receita Federal/Tesouro.</li>
</ul>

<div class="callout alert"><span class="callout-label">Não use CADIN como argumento de inabilitação</span>A Lei 14.133 não exige consulta ao CADIN como requisito de habilitação. O TCU já decidiu (Acórdão 1782/2013) que pendência no CADIN, isoladamente, não impede licitar. Use as quatro primeiras bases.</div>

<p>Em Compras.gov.br, o SICAF já roda essas consultas automaticamente para o licitante cadastrado. Mas o pregoeiro nem sempre verifica todas — apontar omissão é frequente.</p>`
},
{
  id:'certificacoes',
  titulo:'Certificações Específicas por Segmento',
  conteudo:`<p>Depende do objeto. Onde o licitante experiente caça falha:</p>
<ul>
<li><strong>ANVISA</strong> — produtos para saúde, medicamentos, cosméticos e alimentos industrializados. Registro ativo, não cancelado.</li>
<li><strong>INMETRO</strong> — bens com certificação compulsória (extintor, EPI, cabo elétrico, capacete, brinquedo).</li>
<li><strong>ANATEL</strong> — equipamentos de telecomunicação.</li>
<li><strong>MAPA</strong> — produtos agropecuários, fertilizantes, defensivos.</li>
<li><strong>IBAMA</strong> — produtos com potencial poluente; cadastro técnico federal.</li>
<li><strong>ISO 9001, 14001, 27001</strong> — quando exigido: conferir validade E escopo certificado (empresa pode ter ISO para atividade que não cobre o objeto licitado).</li>
<li><strong>PBQP-H</strong> — qualificação obrigatória em obras com recurso federal.</li>
</ul>`
},
{
  id:'marcamodelo',
  titulo:'Marca/Modelo não indicada no Cadastro Inicial',
  conteudo:`<p>Cenário comum: o concorrente venceu mas não preencheu o campo de marca/modelo na proposta inicial; só apresentou depois de vencer, na proposta ajustada.</p>

<p>No pregão eletrônico, a proposta tem dois momentos: <strong>proposta inicial</strong> (cadastrada antes da abertura) e <strong>proposta ajustada/final</strong> (enviada pelo vencedor após os lances). A indicação de marca/modelo deve constar da proposta inicial.</p>

<div class="grid-3">
<div class="mini-card"><span class="mini-card-label">Cenário A</span><div class="mini-card-title">Campo em branco → indicou depois</div><div class="mini-card-body">Argumento sólido: Art. 59, V + princípio da imutabilidade + Art. 64. Resultado: depende do edital e pregoeiro.</div></div>
<div class="mini-card"><span class="mini-card-label">Cenário B</span><div class="mini-card-title">Indicou uma marca → trocou depois</div><div class="mini-card-body">Desclassificação mais clara. Alteração de especificação do objeto é vedada.</div></div>
<div class="mini-card"><span class="mini-card-label">Cenário C</span><div class="mini-card-title">Edital não exigia no cadastro</div><div class="mini-card-body">Recurso enfraquece muito. Sem cláusula expressa, formalismo moderado prevalece.</div></div>
</div>

<p><strong>Como estruturar o recurso em 3 camadas:</strong></p>
<ol>
<li><strong>1ª camada:</strong> cite literalmente o item do edital que exige indicação de marca/modelo na proposta inicial.</li>
<li><strong>2ª camada:</strong> cite Art. 5° (vinculação ao edital) e Art. 64 (vedação à apresentação posterior). Reference o Acórdão TCU 76302-03/2022 que diferencia descrição do objeto (proposta inicial) de composição de custos (proposta ajustada).</li>
<li><strong>3ª camada:</strong> antecipe o formalismo moderado. Argumente que marca/modelo é elemento substancial da especificação, não mera formalidade — indicação tardia equivale a fabricar proposta vencedora a partir do preço dos concorrentes.</li>
</ol>`
},
{
  id:'jurisprudencia',
  titulo:'Jurisprudência Operacional',
  conteudo:`<div class="jurisprudencia-list">
<div class="juri-item"><div class="juri-item-ref">Acórdão 2302/2012-TCU-Plenário — Formalismo Moderado</div><div class="juri-item-text">Falhas meramente formais não causam desclassificação automática. Base para o pregoeiro sanar erros não essenciais por diligência.</div></div>
<div class="juri-item"><div class="juri-item-ref">Acórdão 357/2015-TCU-Plenário — Formalismo Moderado II</div><div class="juri-item-text">Reafirma o princípio do formalismo moderado; defende a proposta mais vantajosa quando houver apenas vício não essencial.</div></div>
<div class="juri-item"><div class="juri-item-ref">Acórdão 1487/2019-TCU-Plenário — Planilha de Custos</div><div class="juri-item-text">"A mera existência de erro material ou omissão na planilha de custos não enseja desclassificação antecipada; a Administração deve promover diligência junto ao interessado para correção, sem permitir alteração do valor global originário."</div></div>
<div class="juri-item"><div class="juri-item-ref">Acórdão 1211/2021-TCU-Plenário — Documentos Ausentes</div><div class="juri-item-text">"Documentos ausentes comprobatórios de condições atendidas no momento da proposta original podem ser solicitados via diligência; a vedação à inclusão posterior não se aplica a documentos que comprovam situação que já existia."</div></div>
<div class="juri-item"><div class="juri-item-ref">Acórdão 29/2024-TCU-Plenário — Atestado Falso</div><div class="juri-item-text">"Atestado de capacidade técnica com data anterior à fundação da empresa atestada é falso; gera inidoneidade tanto da empresa emitente quanto da apresentante."</div></div>
<div class="juri-item"><div class="juri-item-ref">Acórdão 920/2022-TCU-Plenário — Atestado com Conteúdo Falso</div><div class="juri-item-text">"Atestado com conteúdo falso fere princípios de isonomia e moralidade; fundamenta inabilitação."</div></div>
<div class="juri-item"><div class="juri-item-ref">Acórdão 7289/2022-TCU-Plenário — Cláusulas Restritivas</div><div class="juri-item-text">"O agente de contratação tem dever de revisar cláusula restritiva do edital mesmo quando a impugnação não é conhecida formalmente; se o ponto for procedente, é obrigado a corrigir de ofício."</div></div>
<div class="juri-item"><div class="juri-item-ref">Acórdão 465/2024-TCU-Plenário — Inexequibilidade</div><div class="juri-item-text">"Inexequibilidade não é presunção absoluta; mesmo proposta inferior a 75% (engenharia) ou 50% (bens/serviços) exige diligência prévia. Desclassificação sumária é ilegal."</div></div>

function renderSidebar(){
  const sb = document.getElementById('sidebar');
  let html = '';
  if(currentSection==='teoria'){
    html += '<div class="sidebar-section-title">Teoria</div>';
    TEORIA.forEach((t,i)=>{
      html += `<a class="sidebar-link" href="#" data-id="${t.id}" onclick="scrollToId('${t.id}');return false;">${String(i+1).padStart(2,'0')} ${t.titulo}</a>`;
    });
  } else if(currentSection==='legislacao'){
    html += '<div class="sidebar-section-title">Legislação</div>';
    LEGISLACAO.forEach(l=>{
      html += `<a class="sidebar-link" href="#" data-id="${l.id}" onclick="scrollToId('${l.id}');return false;">${l.titulo}</a>`;
    });
  } else if(currentSection==='checklist'){
    html += '<div class="sidebar-section-title">Checklist</div>';
    CHECKLIST.forEach((g,i)=>{
      html += `<a class="sidebar-link" href="#" onclick="scrollToGrupo(${i});return false;">${g.secao}</a>`;
    });
  } else {
    html += '<div class="sidebar-section-title">Calculadora</div>';
    html += '<a class="sidebar-link" href="#" onclick="scrollCalc(\'c-custo\');return false;">Dados do item</a>';
    html += '<a class="sidebar-link" href="#" onclick="scrollCalc(\'c-tipo\');return false;">Tipo de empresa</a>';
    html += '<div class="sidebar-divider"></div>';
    html += '<div class="sidebar-section-title">Tabelas</div>';
    html += '<a class="sidebar-link" href="#" onclick="scrollCalc(\'simples-tables\');return false;">Simples Nacional</a>';
  }
  sb.innerHTML = html;
}

function scrollToId(id){
  const el = document.getElementById('t-'+id)||document.getElementById('l-'+id);
  if(el) el.scrollIntoView({behavior:'smooth',block:'start'});
}
function scrollToGrupo(i){
  const el = document.getElementById('grupo-'+i);
  if(el) el.scrollIntoView({behavior:'smooth',block:'start'});
}
function scrollCalc(id){
  const el = document.getElementById(id);
  if(el) el.scrollIntoView({behavior:'smooth',block:'start'});
}

// RENDER CHECKLIST

function renderChecklist(){
  let html = `<div class="section-header">
    <div class="section-eyebrow"><span class="dot"></span>Checklist<span class="dot"></span>30+ Itens</div>
    <h1 class="section-title">Checklist de Desclassificação</h1>
    <p class="section-subtitle">Clique em qualquer item para ver jurisprudência, observações e o texto de recurso pronto para copiar.</p>
  </div>
  <div class="ck-search-wrap">
    <input class="ck-search" type="text" placeholder="Buscar item (ex: CND, atestado, balanço…)" oninput="filterChecklist(this.value)">
  </div>
  <div id="ck-grupos">`;

  CHECKLIST.forEach((g,gi)=>{
    html += `<div class="grupo" id="grupo-${gi}" data-grupo="${gi}">
      <div class="grupo-header" onclick="toggleGrupo(${gi})">
        <span class="grupo-eyebrow">${g.secao}</span>
        <span class="grupo-count">${g.itens.length} itens</span>
        <span class="grupo-chevron">▼</span>
      </div>
      <div class="grupo-items">`;
    g.itens.forEach((item,ii)=>{
      const key = `${gi}-${ii}`;
      const checked = checkedItems[key]?'checked':'';
      const savedRecurso = localStorage.getItem('recurso_'+key)||item.recurso;
      const obsFormatted = item.observacoes.replace(/\n/g,'<br>');
      html += `<div class="ck-item" id="ck-${key}" data-tipo="${item.tipo.toLowerCase()}">
        <div class="ck-item-header" onclick="toggleItem('${key}',event)">
          <div class="ck-check ${checked}" onclick="toggleCheck('${key}',event)">✓</div>
          <span class="ck-item-titulo">${item.tipo}</span>
          <span class="ck-item-badge">${g.badge}</span>
          <span class="ck-item-arrow">▼</span>
        </div>
        <div class="ck-expand">
          <div class="ck-panels">
            <div>
              <span class="ck-panel-label">Jurisprudência</span>
              <div class="ck-panel-content">${escHtml(item.jurisprudencia)}</div>
            </div>
            <div>
              <span class="ck-panel-label">Observações</span>
              <div class="ck-panel-content">${obsFormatted}</div>
            </div>
            <div class="ck-recurso-wrap">
              <span class="ck-panel-label">Recurso</span>
              <div class="ck-recurso-actions">
                <button class="ck-btn" onclick="toggleEdit('${key}',this)">Editar</button>
                <button class="ck-btn" onclick="copyRecurso('${key}',this)">Copiar</button>
              </div>
              <div class="ck-recurso-text" id="recurso-${key}" data-original="${escAttr(item.recurso)}">${escHtml(savedRecurso)}</div>
            </div>
          </div>
        </div>
      </div>`;
    });
    html += `</div></div>`;
  });
  html += '</div>';
  document.getElementById('main').innerHTML = html;
}

function toggleGrupo(gi){
  const el = document.getElementById('grupo-'+gi);
  el.classList.toggle('collapsed');
}

function toggleItem(key, e){
  const el = document.getElementById('ck-'+key);
  el.classList.toggle('open');
}

function toggleCheck(key,e){
  e.stopPropagation();
  const el = document.querySelector(`#ck-${key} .ck-check`);
  el.classList.toggle('checked');
  checkedItems[key]=el.classList.contains('checked');
  localStorage.setItem('ck_checked',JSON.stringify(checkedItems));
}

function toggleEdit(key,btn){
  const box = document.getElementById('recurso-'+key);
  if(btn.textContent==='Editar'){
    box.contentEditable='true';
    box.focus();
    btn.textContent='Salvar';
  } else {
    box.contentEditable='false';
    localStorage.setItem('recurso_'+key, box.innerText);
    btn.textContent='Editar';
  }
}

function copyRecurso(key,btn){
  const box = document.getElementById('recurso-'+key);
  const text = box.innerText||box.textContent;
  navigator.clipboard.writeText(text).then(()=>{
    const orig = btn.textContent;
    btn.textContent='Copiado ✓';
    btn.classList.add('copied');
    setTimeout(()=>{btn.textContent=orig;btn.classList.remove('copied');},2000);
  }).catch(()=>{
    const ta = document.createElement('textarea');
    ta.value=text;ta.style.position='fixed';ta.style.opacity='0';
    document.body.appendChild(ta);ta.select();document.execCommand('copy');
    document.body.removeChild(ta);
    btn.textContent='Copiado ✓';btn.classList.add('copied');
    setTimeout(()=>{btn.textContent='Copiar';btn.classList.remove('copied');},2000);
  });
}

function filterChecklist(q){
  q=q.toLowerCase().trim();
  CHECKLIST.forEach((g,gi)=>{
    const grupo = document.getElementById('grupo-'+gi);
    if(!grupo) return;
    let grupoVisible=false;
    g.itens.forEach((item,ii)=>{
      const el = document.getElementById(`ck-${gi}-${ii}`);
      if(!el) return;
      const match = !q || item.tipo.toLowerCase().includes(q)||item.jurisprudencia.toLowerCase().includes(q)||item.observacoes.toLowerCase().includes(q);
      el.style.display=match?'':'none';
      if(match) grupoVisible=true;
    });
    grupo.style.display=grupoVisible?'':'none';
  });
}

function escHtml(s){
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
function escAttr(s){
  return String(s).replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}

function switchSection(section){
  currentSection=section;
  document.querySelectorAll('.nav-btn').forEach(b=>{
    b.classList.toggle('active',b.dataset.section===section);
  });
  document.getElementById('main').scrollTop=0;
  renderSidebar();
  if(section==='teoria') renderTeoria();
  else if(section==='legislacao') renderLegislacao();
  else if(section==='checklist') renderChecklist();
  else renderCalculadora();
}

document.querySelectorAll('.nav-btn').forEach(btn=>{
  btn.addEventListener('click',()=>switchSection(btn.dataset.section));
});

function renderCalculadora(){
  const html = `
  <div class="section-header">
    <div class="section-eyebrow"><span class="dot"></span>Simples Nacional<span class="dot"></span>Alíquota Reversa</div>
    <h1 class="section-title">Calculadora de Preços</h1>

  </div>

  <div class="calc-layout">
    <div>
      <div class="calc-form-card">
        <div class="calc-form-title">Dados do item</div>

        <div class="field-row">
          <div class="field-group">
            <label class="field-label" for="c-qty">Quantidade</label>
            <input class="field-input" id="c-qty" type="number" min="1" value="5" oninput="calcUpdate()">
          </div>
          <div class="field-group">
            <label class="field-label" for="c-custo">Custo unitário (R$)</label>
            <input class="field-input" id="c-custo" type="number" min="0" step="0.01" value="100" oninput="calcUpdate()">
          </div>
        </div>

        <div class="field-group">
          <label class="field-label" for="c-frete">Frete / Logística por item (R$)</label>
          <input class="field-input" id="c-frete" type="number" min="0" step="0.01" value="10" oninput="calcUpdate()">
          <div class="field-hint">Custo de entrega rateado por unidade. Coloque 0 se não houver.</div>
        </div>

        <div class="field-group">
          <label class="field-label" for="c-lucro">Margem de lucro desejada (%)</label>
          <input class="field-input" id="c-lucro" type="number" min="0" max="99" step="0.1" value="30" oninput="calcUpdate()">
          <div class="field-hint">O ideal é no mínimo 20%. O lucro é calculado sobre o preço de venda (não sobre o custo).</div>
        </div>

        <div class="field-group">
          <label class="field-label" for="c-tipo">Tipo de empresa</label>
          <select class="field-select" id="c-tipo" onchange="calcTipoChange()">
            <option value="comercio">Comércio — Anexo I</option>
            <option value="servico">Serviços — Anexo IV</option>
          </select>
        </div>

        <div class="field-group">
          <label class="field-label" for="c-faixa">Faixa de faturamento anual</label>

          <input class="field-input" id="c-aliquota" type="number" min="0" max="99" step="0.01" value="4.20" oninput="calcUpdate()">

function calcPopulateFaixas(){
  const tipo = document.getElementById('c-tipo').value;
  const sel = document.getElementById('c-faixa');
  sel.innerHTML = '';
  SIMPLES[tipo].faixas.forEach((f,i)=>{
    const opt = document.createElement('option');
    opt.value = i;
    opt.textContent = f.faixa + ' — reversa ' + pct(f.reversa);
    sel.appendChild(opt);
  });
  const aliq = SIMPLES[tipo].faixas[0].reversa;
  document.getElementById('c-aliquota').value = +(aliq*100).toFixed(2);
}

function calcTipoChange(){
  calcPopulateFaixas();
  calcUpdate();
}

function calcFaixaChange(){
  const tipo = document.getElementById('c-tipo').value;
  const fi   = parseInt(document.getElementById('c-faixa').value);
  const aliq = SIMPLES[tipo].faixas[fi].reversa;
  document.getElementById('c-aliquota').value = +(aliq*100).toFixed(2);
  calcUpdate();
}

function calcUpdate(){
  const qty    = parseFloat(document.getElementById('c-qty').value)    || 0;
  const custo  = parseFloat(document.getElementById('c-custo').value)  || 0;
  const frete  = parseFloat(document.getElementById('c-frete').value)  || 0;
  const lucro  = parseFloat(document.getElementById('c-lucro').value)  / 100 || 0;
  const aliq   = parseFloat(document.getElementById('c-aliquota').value) / 100 || 0;

  const tipo = document.getElementById('c-tipo').value;
  const fi   = parseInt(document.getElementById('c-faixa').value) || 0;
  const nominal = SIMPLES[tipo].faixas[fi] ? SIMPLES[tipo].faixas[fi].nominal : null;

  const denom = 1 - aliq - lucro;
  const pmvEl = document.getElementById('r-pmv');

  if(denom <= 0 || custo + frete === 0){
    pmvEl.textContent = 'Verifique os valores';
    pmvEl.className = 'calc-pmv-value error';
    ['r-custo-total','r-imposto','r-lucro','r-total','r-nominal'].forEach(id=>{
      document.getElementById(id).textContent = '—';
    });
    renderSimplesTables(-1,-1);
    return;
  }

  const pmv         = (custo + frete) / denom;
  const impostoR    = pmv * aliq;
  const lucroR      = pmv * lucro;
  const total       = pmv * qty;

  pmvEl.textContent = brl(pmv);
  pmvEl.className   = 'calc-pmv-value';
  document.getElementById('r-custo-total').textContent = brl(custo + frete);
  document.getElementById('r-imposto').textContent     = brl(impostoR);
  document.getElementById('r-lucro').textContent       = brl(lucroR);
  document.getElementById('r-nominal').textContent     = nominal !== null ? pct(nominal) : '—';
  document.getElementById('r-total').textContent       = brl(total);

  const tipoIdx = tipo === 'comercio' ? 0 : 1;
  renderSimplesTables(tipoIdx, fi);
}

function renderSimplesTables(activeTipo, activeFaixa){
  const wrap = document.getElementById('simples-tables');
  if(!wrap) return;
  const types = ['comercio','servico'];
  wrap.innerHTML = types.map((t,ti)=>{
    const d = SIMPLES[t];
    const rows = d.faixas.map((f,fi)=>{
      const sel = (ti===activeTipo && fi===activeFaixa) ? 'selected' : '';
      return `<tr class="${sel}" onclick="calcSelectFaixa('${t}',${fi})">
        <td>${f.faixa}</td>
        <td class="num">${pct(f.nominal)}</td>
        <td class="rev">${pct(f.reversa)}</td>
      </tr>`;
    }).join('');
    return `<div class="simples-table-wrap">
      <div class="simples-table-header">
        <div class="simples-table-title">${d.label}</div>
        <div class="simples-table-sub">Clique na faixa para aplicar na calculadora</div>
      </div>
      <table class="simples">
        <thead><tr><th>Faturamento anual</th><th style="text-align:right">Nominal</th><th style="text-align:right">Reversa</th></tr></thead>
        <tbody>${rows}</tbody>
      </table>
    </div>`;
  }).join('');
}

function calcSelectFaixa(tipo, fi){
  document.getElementById('c-tipo').value = tipo;
  calcPopulateFaixas();
  document.getElementById('c-faixa').value = fi;
  calcFaixaChange();
}

function brl(v){
  return v.toLocaleString('pt-BR',{style:'currency',currency:'BRL',minimumFractionDigits:2});
}
function pct(v){
  return (v*100).toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2})+'%';
}

function applyTheme(isLight){
  document.documentElement.classList.toggle('light', isLight);
  document.getElementById('theme-icon-moon').style.display = isLight ? 'none' : 'block';
  document.getElementById('theme-icon-sun').style.display  = isLight ? 'block' : 'none';
  document.getElementById('theme-label').textContent = isLight ? 'Escuro' : 'Claro';
}
function toggleTheme(){
  const isLight = !document.documentElement.classList.contains('light');
  localStorage.setItem('theme', isLight ? 'light' : 'dark');
  applyTheme(isLight);
}
applyTheme(localStorage.getItem('theme') === 'light');
