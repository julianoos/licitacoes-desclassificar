            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
          </div>
          <div class="er-upload-label">Clique ou arraste o arquivo aqui</div>
          <div class="er-upload-hint">PDF, Excel (.xlsx) ou Word (.docx)</div>
        </div>
        <input type="file" id="er-file-input" accept=".pdf,.xlsx,.xls,.docx,.doc" style="display:none">
        <div id="er-file-info" style="display:none" class="er-file-info">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>
          <span class="er-file-name" id="er-file-name-label"></span>
          <span class="er-file-size" id="er-file-size-label"></span>
          <button class="er-file-remove" onclick="erRemoveFile()" title="Remover arquivo">×</button>
        </div>
      </div>
      <div id="er-result-area"></div>
      <div id="er-history" class="er-history-section" style="${hist.length?'':'display:none'}">
        <div class="er-history-title">Histórico de análises</div>
        <div class="er-history-list" id="er-history-list"></div>
        <button class="er-history-clear" onclick="erClearHistory()">Limpar histórico</button>
      </div>
    </div>
    <div class="er-panel">
      <div class="er-panel-title">Tipo de análise</div>
      <div class="er-type-row">
        <button class="er-type-btn active" id="er-btn-resumida" onclick="erSetType('resumida')">Resumida</button>
        <button class="er-type-btn" id="er-btn-completa" onclick="erSetType('completa')">Completa</button>
      </div>
      <button class="er-analyze-btn" id="er-analyze-btn" onclick="erAnalyze()" disabled>Analisar Edital</button>
    </div>
  </div>`;

  erFile = null;
  erExtractedText = '';
  erAnalysisType = 'resumida';
  erRenderHistory();
  erInitUpload();
}

function erInitUpload(){
  const input = document.getElementById('er-file-input');
  const zone = document.getElementById('er-drop-zone');
  if(!input || !zone) return;

  input.addEventListener('change', ()=>{ if(input.files[0]) erLoadFile(input.files[0]); });

  zone.addEventListener('dragover', e=>{ e.preventDefault(); zone.classList.add('drag-over'); });
  zone.addEventListener('dragleave', ()=>zone.classList.remove('drag-over'));
  zone.addEventListener('drop', e=>{
    e.preventDefault(); zone.classList.remove('drag-over');
    if(e.dataTransfer.files[0]) erLoadFile(e.dataTransfer.files[0]);
  });
}

function erLoadFile(file){
  erFile = file;
  const info = document.getElementById('er-file-info');
  const nameEl = document.getElementById('er-file-name-label');
  const sizeEl = document.getElementById('er-file-size-label');
  nameEl.textContent = file.name;
  sizeEl.textContent = (file.size/1024/1024).toFixed(1)+' MB';
  info.style.display = 'flex';
  document.getElementById('er-analyze-btn').disabled = false;
}

function erRemoveFile(){
  erFile = null;
  erExtractedText = '';
  document.getElementById('er-file-info').style.display = 'none';
  document.getElementById('er-file-input').value = '';
  document.getElementById('er-analyze-btn').disabled = true;
}

function erSetType(type){
  erAnalysisType = type;
  document.getElementById('er-btn-resumida').classList.toggle('active', type==='resumida');
  document.getElementById('er-btn-completa').classList.toggle('active', type==='completa');
}

function erRenderHistory(){
  const hist = erGetHistory();
  const section = document.getElementById('er-history');
  const list = document.getElementById('er-history-list');
  if(!section || !list) return;
  if(!hist.length){ section.style.display='none'; return; }
  section.style.display = '';
  list.innerHTML = hist.map((h,i)=>`
    <div class="er-history-item" onclick="erShowHistoryItem(${i})">
      <span class="er-history-name">${h.nomeArquivo}</span>
      <span class="er-history-meta">${h.data} · ${h.tipo==='resumida'?'Resumida':'Completa'}</span>
    </div>`).join('');
}

function erShowHistoryItem(i){
  const hist = erGetHistory();
  const h = hist[i];
  if(!h) return;
  erLastResult = h.resultado;
  erRenderResult(h.resultado, h.tipo, h.nomeArquivo);
}

function erClearHistory(){
  localStorage.removeItem('edital_historico');
  const section = document.getElementById('er-history');
  if(section) section.style.display='none';
}

// ─── EXTRACT TEXT ───
async function erExtractText(file){
  const ext = file.name.split('.').pop().toLowerCase();
  if(ext==='pdf') return erExtractPDF(file);
  if(['xlsx','xls'].includes(ext)) return erExtractExcel(file);
  if(['docx','doc'].includes(ext)) return erExtractWord(file);
  throw new Error('Formato não suportado: '+ext);
}

async function erExtractPDF(file){
  const pdfjsLib = window['pdfjs-dist/build/pdf'] || window.pdfjsLib;
  if(!pdfjsLib) throw new Error('PDF.js não carregado');
  pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
  const arrayBuffer = await file.arrayBuffer();
  const pdf = await pdfjsLib.getDocument({data: arrayBuffer}).promise;
  let text = '';
  for(let i=1; i<=pdf.numPages; i++){
    const page = await pdf.getPage(i);
    const content = await page.getTextContent();
    text += content.items.map(s=>s.str).join(' ') + '\n';
  }
  return text.trim();
}

async function erExtractExcel(file){
  if(!window.XLSX) throw new Error('SheetJS não carregado');
  const arrayBuffer = await file.arrayBuffer();
  const wb = XLSX.read(arrayBuffer, {type:'array'});
  let text = '';
  wb.SheetNames.forEach(name=>{
    const ws = wb.Sheets[name];
    text += `\n=== Aba: ${name} ===\n`;
    text += XLSX.utils.sheet_to_csv(ws);
  });
  return text.trim();
}

async function erExtractWord(file){
  if(!window.mammoth) throw new Error('Mammoth.js não carregado');
  const arrayBuffer = await file.arrayBuffer();
  const result = await mammoth.extractRawText({arrayBuffer});
  return result.value.trim();
}

// ─── ANALYZE ───
async function erAnalyze(){
  if(!erFile) return;
  const btn = document.getElementById('er-analyze-btn');
  const resultArea = document.getElementById('er-result-area');
  btn.disabled = true;
  resultArea.innerHTML = `<div class="er-loading"><div class="er-spinner"></div>Extraindo texto do arquivo...</div>`;

  try {
    erExtractedText = await erExtractText(erFile);
  } catch(e) {
    resultArea.innerHTML = `<div class="er-error">Erro ao extrair texto: ${e.message}<br>Tente outro formato ou verifique se o arquivo não está protegido por senha.</div>`;
    btn.disabled = false;
    return;
  }

  if(!erExtractedText || erExtractedText.length < 50){
    resultArea.innerHTML = `<div class="er-error">Não foi possível extrair texto deste arquivo. O PDF pode conter apenas imagens (escaneado). Tente converter para Word antes de fazer upload.</div>`;
    btn.disabled = false;
    return;
  }

  resultArea.innerHTML = `<div class="er-loading"><div class="er-spinner"></div>Analisando edital com Gemma 4... Aguarde.</div>`;

  const prompt = erAnalysisType === 'resumida' ? PROMPT_RESUMIDA : PROMPT_COMPLETA;

  try {
    const response = await fetch('https://openrouter.ai/api/v1/chat/completions', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'Authorization': `Bearer ${OPENROUTER_KEY}`,
        'HTTP-Referer': 'https://licitacoes-local.app',
        'X-Title': 'Licitacoes - Leitor de Editais'
      },
      body: JSON.stringify({
        model: ER_MODEL,
        messages: [
          { role: 'system', content: prompt },
          { role: 'user', content: erExtractedText }
        ],
        max_tokens: 4096,
        provider: { allow_fallbacks: false }
      })
    });

    if(!response.ok){
      const err = await response.json().catch(()=>({}));
      throw new Error(err.error?.message || `Erro HTTP ${response.status}`);
    }

    const data = await response.json();
    const resultado = data.choices?.[0]?.message?.content || '';
    if(!resultado) throw new Error('Resposta vazia do modelo');

    erLastResult = resultado;

    const now = new Date();
    const dataStr = now.toLocaleDateString('pt-BR');
    erSaveHistory({ nomeArquivo: erFile.name, data: dataStr, tipo: erAnalysisType, resultado });

    erRenderResult(resultado, erAnalysisType, erFile.name);
    erRenderHistory();

  } catch(e) {
    resultArea.innerHTML = `<div class="er-error">Erro ao chamar o Gemma: ${e.message}<br>Verifique sua conexão e tente novamente.</div>`;
  }

  btn.disabled = false;
}

// ─── RENDER RESULT ───
function erRenderResult(texto, tipo, nomeArquivo){
  const resultArea = document.getElementById('er-result-area');
  if(!resultArea) return;
  const html = erMarkdownToHtml(texto);
  const tipoLabel = tipo === 'resumida' ? 'Análise Resumida' : 'Análise Completa';
  const completePrompt = tipo === 'resumida' ? `
    <div class="er-complete-prompt">
      <span class="er-complete-text">Deseja uma análise completa com 7 seções detalhadas?</span>
      <button class="er-complete-btn" onclick="erSetType('completa');erAnalyze()">Análise Completa →</button>
    </div>` : '';

  resultArea.innerHTML = `
    <div class="er-result-card">
      <div class="er-result-header">
        <div>
          <div class="er-result-eyebrow">${tipoLabel}</div>
          <div style="font-size:12px;color:var(--muted-2);margin-top:3px;font-weight:300">${nomeArquivo}</div>
        </div>
        <button class="er-copy-btn" onclick="erCopyResult(this)">Copiar</button>
      </div>
      <div class="er-result-content">${html}</div>
      ${completePrompt}
    </div>`;
}

function erMarkdownToHtml(md){
  return md
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
    .replace(/^## (.+)$/gm,'<h2>$1</h2>')
    .replace(/^### (.+)$/gm,'<h3>$1</h3>')
    .replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>')
    .replace(/^- (.+)$/gm,'<li>$1</li>')
    .replace(/(<li>[\s\S]*?<\/li>)/g,'<ul>$1</ul>')
    .replace(/<\/ul>\s*<ul>/g,'')
    .replace(/`(.+?)`/g,'<code>$1</code>')
    .replace(/\n{2,}/g,'</p><p>')
    .replace(/^(?!<[hul])(.+)$/gm,'<p>$1</p>')
    .replace(/<p><\/p>/g,'')
    .replace(/<p>(<[hul])/g,'$1')
    .replace(/(<\/[hul][^>]*>)<\/p>/g,'$1');
}

async function erCopyResult(btn){
  try {
    await navigator.clipboard.writeText(erLastResult);
    btn.textContent = 'Copiado ✓';
    setTimeout(()=>btn.textContent='Copiar', 2000);
  } catch(e){
    const ta = document.createElement('textarea');
    ta.value = erLastResult;
    document.body.appendChild(ta);
    ta.select();
    document.execCommand('copy');
    document.body.removeChild(ta);
    btn.textContent = 'Copiado ✓';
    setTimeout(()=>btn.textContent='Copiar', 2000);
  }
}

// ─── INIT ───
switchSection('home');
</script>
